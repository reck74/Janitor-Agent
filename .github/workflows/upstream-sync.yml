name: 🔄 Upstream Sync (NousResearch/hermes-agent)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 0

      - name: Sync and Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream

          # 1. Comprobar si hay commits nuevos en upstream
          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$UPSTREAM_COMMITS" -eq 0 ]; then
            echo "✅ Todo está al día con upstream (Hashes idénticos)."
            exit 0
          fi

          # 2. Crear rama temporal
          BRANCH_NAME="upstream-sync-$(date +%Y%m%d%H%M%S)"
          git checkout -b $BRANCH_NAME

          # 3. Forzar un merge commit (NO fast-forward) para trazar la historia
          git merge upstream/main --no-ff -m "chore: sync with upstream" || true

          # 4. Poda estricta de CI de upstream
          find .github/workflows -type f ! -name 'tests.yml' ! -name 'upstream-sync.yml' -exec git rm -f {} + || true
          git commit --amend --no-edit || true

          # 5. EL ESCUDO: Verificar si realmente hay un diff de código contra main
          if git diff --quiet main..HEAD; then
            echo "✅ Tras el merge y la poda, el código final es idéntico a main. No se requiere PR."
            exit 0
          fi

          # 6. Subir y crear PR (con pausa para que GitHub indexe la rama)
          git push -u origin $BRANCH_NAME
          sleep 3
          gh pr create --title "🔄 Upstream Sync" --body "Sincronización automática con NousResearch. Revisa los cambios." --head $BRANCH_NAME --base main
