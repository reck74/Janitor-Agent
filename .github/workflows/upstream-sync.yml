name: Upstream stable sync (NousResearch/hermes-agent)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: janitor-upstream-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 0
      - name: Merge the latest published stable tag into a reviewable PR
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch origin main
          stable_tag="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq '.tag_name')"
          [[ "$stable_tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid stable tag'; exit 1; }
          git fetch upstream tag "$stable_tag"
          stable_commit="$(git rev-parse "$stable_tag^{commit}")"
          if git merge-base --is-ancestor "$stable_commit" origin/main; then
            echo "Already contains stable $stable_tag ($stable_commit)."
            exit 0
          fi
          # A fixed tag branch allows a rerun to find the existing review.
          branch="upstream-sync-$stable_tag"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo 'A stable sync PR is already open.'
            exit 0
          fi
          git checkout -b "$branch" origin/main
          if ! git merge --no-edit -m "chore(sync): Hermes $stable_tag" "$stable_commit"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            body="$(mktemp)"
            printf 'Stable Hermes %s (%s) requires manual resolution.\n\nConflicting paths:\n```\n%s\n```\n\nFollow MERGE_GUIDE.md. Preserve Janitor extensions and all CI/security workflows.\n' "$stable_tag" "$stable_commit" "$conflicts" > "$body"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Stable sync conflicts: $stable_tag" --body-file "$body"
            rm -f "$body"
            exit 1
          fi
          # Never prune workflows after a merge: their contracts are part of the fork gate.
          python3 scripts/audit_janitor_merge.py --base origin/main
          git push origin "HEAD:refs/heads/$branch"
          body="$(mktemp)"
          printf 'Update the Hermes base to stable %s (%s).\n\nReview fork directives and run the Janitor manifest, frontend gates and full upstream-sync-verify acceptance before merging.\n' "$stable_tag" "$stable_commit" > "$body"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "chore(sync): Hermes $stable_tag" --body-file "$body"
          rm -f "$body"
