name: 🔄 Upstream Sync (NousResearch/hermes-agent)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 0

      - name: Sync and Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream

          # 1. Comprobar si hay cambios reales
          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$UPSTREAM_COMMITS" -eq 0 ]; then
            echo "✅ Todo está al día con upstream. No hay nada que sincronizar."
            exit 0
          fi

          # 2. Hay cambios: Crear rama (Comando date seguro sin espacios ni dos puntos)
          BRANCH_NAME="upstream-sync-$(date +%Y%m%d%H%M%S)"
          git checkout -b $BRANCH_NAME

          # 3. Merge
          git merge upstream/main --no-edit || true

          # 4. Poda de CI de upstream para no heredar basura
          find .github/workflows -type f ! -name 'tests.yml' ! -name 'upstream-sync.yml' -exec git rm -f {} + || true
          git commit --amend --no-edit || true

          # 5. Subir y crear PR
          git push -u origin $BRANCH_NAME
          gh pr create --title "🔄 Upstream Sync" --body "Sincronización automática con NousResearch. Revisa los cambios." --head $BRANCH_NAME --base main
