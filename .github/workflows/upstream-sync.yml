name: 🔄 Upstream Sync (NousResearch/hermes-agent)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 0

      - name: Sync and Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream
          git fetch origin main

          # 1. Comprobar si hay commits nuevos en upstream
          UPSTREAM_COMMITS=$(git rev-list origin/main..upstream/main --count)
          if [ "$UPSTREAM_COMMITS" -eq 0 ]; then
            echo "✅ Todo está al día con upstream."
            exit 0
          fi

          # 2. Crear rama desde origin/main
          BRANCH_NAME="upstream-sync-$(date +%Y%m%d%H%M%S)"
          git checkout -b $BRANCH_NAME origin/main

          # 3. Merge con detección explícita de conflictos
          if ! git merge upstream/main --no-edit; then
              echo "🚨 CONFLICTO DETECTADO. Abortando merge automático."
              CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "No se pudieron listar los archivos")
              git merge --abort 2>/dev/null || true
              git checkout main
              git branch -D $BRANCH_NAME 2>/dev/null || true
              ISSUE_BODY=$(printf "El bot intentó sincronizar con upstream pero encontró conflictos de merge.\n\n**Rama**: \`%s\`\n**Archivos en conflicto**:\n\`\`\`\n%s\n\`\`\`\n\nPor favor, realiza un \`git fetch upstream && git merge upstream/main\` localmente para resolverlos." "$BRANCH_NAME" "$CONFLICT_FILES")
              gh issue create \
                --repo "${{ github.repository }}" \
                --title "🚨 Sincronización Fallida: Conflictos Upstream" \
                --body "$ISSUE_BODY" \
                --assignee reck74 \
                --label "upstream-sync"
              exit 1
          fi

          # 4. Poda de CI (Commit SEPARADO para no corromper el merge)
          find .github/workflows -type f ! -name 'tests.yml' ! -name 'upstream-sync.yml' -exec git rm -f {} + || true
          git commit -m "chore: prune upstream workflows" || true

          # 5. ESCUDO DE TRIPLE VERIFICACIÓN
          MAIN_SHA=$(git rev-parse origin/main)
          HEAD_SHA=$(git rev-parse HEAD)

          # Verificación A: diff de árboles
          if git diff --quiet $MAIN_SHA $HEAD_SHA; then
            echo "✅ Árbol idéntico a main remoto. Sin cambios reales."
            exit 0
          fi

          # Verificación B: conteo de archivos modificados
          UNIQUE_CHANGES=$(git diff --name-only $MAIN_SHA..$HEAD_SHA | wc -l)
          if [ "$UNIQUE_CHANGES" -eq 0 ]; then
            echo "✅ 0 archivos modificados respecto a main. Sin PR necesario."
            exit 0
          fi

          # 6. Subir y crear PR
          git push -u origin $BRANCH_NAME
          sleep 10
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "🔄 Upstream Sync" \
            --body "Sincronización automática con NousResearch. Revisa los cambios." \
            || gh issue create \
              --repo "${{ github.repository }}" \
              --title "🚨 Sync PR failed for $BRANCH_NAME" \
              --body "El workflow de sync creó la rama pero falló al abrir PR. Revisar manualmente." \
              --label "upstream-sync"
