name: 🔄 Upstream Sync (NousResearch/hermes-agent)

# Merges the newest upstream release tag (never upstream/main: commits between
# tags can break the Janitor gates with no release notes to explain them),
# points janitor/overlay.yaml at it, runs scripts/janitor-sync-verify.sh and
# opens a PR that carries the verify result.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 0

      - name: Find newest upstream release
        id: tag
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch --quiet upstream --tags
          git fetch --quiet origin main
          TAG=$(git tag -l 'v20*' --sort=-v:refname | head -1)
          SHA=$(git rev-parse "${TAG}^{commit}")
          BRANCH="upstream-sync-${TAG}"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "✅ origin/main already contains ${TAG}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "ℹ️ ${BRANCH} already exists — its PR is pending review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          BRANCH: ${{ steps.tag.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" origin/main

          if ! git merge "$TAG" --no-edit -m "chore(sync): merge upstream ${TAG}"; then
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "No se pudieron listar los archivos")
            git merge --abort 2>/dev/null || true
            ISSUE_BODY=$(printf "El bot intentó sincronizar con upstream \`%s\` pero encontró conflictos de merge.\n\n**Archivos en conflicto**:\n\`\`\`\n%s\n\`\`\`\n\nResuélvelos localmente (\`git merge %s\`) siguiendo MERGE_GUIDE.md y valida con \`scripts/janitor-sync-verify.sh --base %s\`." "$TAG" "$CONFLICT_FILES" "$TAG" "$SHA")
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "🚨 Sincronización Fallida: Conflictos Upstream ${TAG}" \
              --body "$ISSUE_BODY" \
              --assignee reck74 \
              --label "upstream-sync"
            exit 1
          fi

          # Upstream's own workflows are pruned in a separate commit so the
          # merge commit stays a pure merge.
          find .github/workflows -type f \
            ! -name 'tests.yml' \
            ! -name 'upstream-sync.yml' \
            ! -name 'janitor-ci.yml' \
            ! -name 'janitor-desktop-release.yml' \
            -exec git rm -q -f {} + || true
          git commit -q -m "chore(sync): prune upstream workflows" || true

          sed -i -E \
            -e "s|^  # Hermes .* — upstream parent of the last chore\(sync\) merge\.|  # Hermes ${TAG} — upstream parent of the last chore(sync) merge.|" \
            -e "s|^  base: [0-9a-f]{40}$|  base: ${SHA}|" \
            janitor/overlay.yaml
          git commit -q -am "chore(sync): track upstream ${TAG} in janitor/overlay.yaml"

      - name: Install uv
        if: steps.tag.outputs.skip == 'false'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        if: steps.tag.outputs.skip == 'false'
        run: uv python install 3.11 && uv sync --locked --python 3.11 --extra all --extra dev

      - name: Verify (scripts/janitor-sync-verify.sh)
        id: verify
        if: steps.tag.outputs.skip == 'false'
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -uo pipefail
          # The TUI gate runs on the PR itself (Janitor CI / react-tests).
          scripts/janitor-sync-verify.sh --skip-tui 2>&1 | tee verify.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Push and open PR
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW }}
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ steps.tag.outputs.branch }}
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        run: |
          set -euo pipefail
          git push -u origin "$BRANCH"
          if [ "$VERIFY_STATUS" = "0" ]; then
            RESULT="✅ \`scripts/janitor-sync-verify.sh\` passed."
          else
            RESULT="❌ \`scripts/janitor-sync-verify.sh\` failed (exit ${VERIFY_STATUS}). Fix on this branch before merging — see MERGE_GUIDE.md."
          fi
          BODY=$(printf "Merge of upstream release \`%s\`.\n\n%s\n\n<details><summary>verify log (tail)</summary>\n\n\`\`\`\n%s\n\`\`\`\n</details>\n" \
            "$TAG" "$RESULT" "$(grep -vE '^\[ *[0-9.]+%' verify.log | tail -60)")
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "🔄 Upstream Sync ${TAG}" \
            --body "$BODY" \
            || gh issue create \
              --repo "${{ github.repository }}" \
              --title "🚨 Sync PR failed for ${BRANCH}" \
              --body "El workflow de sync creó la rama pero falló al abrir PR. Revisar manualmente." \
              --label "upstream-sync"
