name: Janitor Desktop release

# Builds the Janitor Desktop AppImage from the upstream apps/desktop plus the
# apps/desktop-janitor overlay and attaches it to the fork's GitHub release.
# The janitor-desktop-launcher skill downloads it from there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the AppImage to
        required: true

permissions:
  contents: write

concurrency:
  group: janitor-desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@12
      - name: Install dependencies
        run: npm ci
      - name: Overlay tests
        run: node --test apps/desktop-janitor/scripts/build.test.mjs
      - name: Build AppImage
        run: node apps/desktop-janitor/scripts/build.mjs --linux AppImage --publish never
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/Janitor-*-linux-x86_64.AppImage)
          test ${#files[@]} -gt 0
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Janitor $TAG" --notes "Janitor $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber
