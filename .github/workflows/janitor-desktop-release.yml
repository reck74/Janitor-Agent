name: Janitor Desktop release

# Builds the Janitor Desktop AppImage from the upstream apps/desktop plus the
# apps/desktop-janitor build overlay (directive #17) and, for a `v*` tag,
# attaches it to the fork's GitHub release, where users download it.
#
# The build is always of the commit this run was triggered for (tag push, a
# manual run from a branch or tag, or a PR head), never of another ref: the app
# bakes that commit into install-stamp.json
# (apps/desktop/scripts/write-build-stamp.mjs reads GITHUB_SHA /
# GITHUB_REF_NAME) and downloads scripts/install.sh at exactly that SHA on
# first run, so the commit must exist on GitHub.
#
# Linux only. macOS and Windows builds need code signing and are not built here.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-janitor/**'
      - '.github/workflows/janitor-desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janitor-desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Overlay tests
        run: node --test apps/desktop-janitor/scripts/build.test.mjs
      - name: Brand patches resolve against apps/desktop
        run: node apps/desktop-janitor/scripts/build.mjs --check
      - name: Build AppImage
        run: |
          # A tag build pins install-stamp.json to the tag's commit but follows
          # `main` afterwards: a tag is not a branch the installer or the
          # updater can track. Other runs keep GITHUB_REF_NAME (the branch).
          if [ "$GITHUB_REF_TYPE" = tag ]; then export GITHUB_REF_NAME=main; fi
          node apps/desktop-janitor/scripts/build.mjs --linux AppImage --publish never
      - name: Verify AppImage and install stamp
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/Janitor-*.AppImage)
          test ${#files[@]} -eq 1
          stamp=apps/desktop/build/install-stamp.json
          cat "$stamp"
          test "$(jq -r .commit "$stamp")" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no -- apps/desktop)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: janitor-desktop-appimage
          path: apps/desktop/release/Janitor-*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    # Publishing runs only for a pushed `v*` tag — never for pull requests or
    # manual runs.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name janitor-desktop-appimage --dir dist
          shopt -s nullglob
          files=(dist/Janitor-*.AppImage)
          test ${#files[@]} -eq 1
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "Janitor $TAG" --notes "Janitor $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber
