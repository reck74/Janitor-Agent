name: 🛠 Janitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install -e ".[all]"

      - name: Run Janitor Python tests
        run: uv run pytest tests/test_janitor_cli.py tests/hermes_cli/test_skin_engine.py -v

  react-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install React dependencies
        run: |
          cd ui-tui
          npm install

      - name: Type-check React code
        run: |
          cd ui-tui
          npm run type-check

      - name: Run React tests
        run: |
          cd ui-tui
          npm test
