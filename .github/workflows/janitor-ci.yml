name: Janitor CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os_compat:
        description: Also run the fork manifest on macOS and native Windows.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: janitor-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  merge-auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Audit fork directives on the introduced diff
        env:
          JANITOR_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${JANITOR_AUDIT_BASE:-HEAD^}"
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then base=HEAD^; fi
          python3 scripts/audit_janitor_merge.py --base "$base"

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          extras: '["web", "messaging", "anthropic"]'
          test-environment: 'true'
      - name: Run the canonical Janitor manifest
        run: python3 scripts/run_janitor_tests.py -j 2 --file-retries 0 --tb=short

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  react-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Build the TUI bundle (directive 7)
        run: npm run build --workspace ui-tui
      - name: Typecheck the TUI
        run: npm run typecheck --workspace ui-tui
      - name: Test the TUI
        run: npm run test --workspace ui-tui -- --maxWorkers=2

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: node
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Check and build the web dashboard
        run: |
          npm run typecheck --workspace web
          npm run test --workspace web -- --maxWorkers=2
          npm run lint --workspace web
          npm run build --workspace web
          test -f hermes_cli/web_dist/index.html
          test -n "$(find hermes_cli/web_dist/assets -type f -print -quit)"

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  installer-e2e:
    name: Linux bootstrap acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["web", "messaging", "anthropic"]'
          test-environment: 'true'
      - name: Full bootstrap with a local provider stub and isolated state
        env:
          HOME: ${{ runner.temp }}/janitor-bootstrap-home
          JANITOR_HOME: ${{ runner.temp }}/janitor-bootstrap-home/.janitor
          HERMES_HOME: ${{ runner.temp }}/janitor-bootstrap-home/.janitor
        run: |
          command -v docker
          docker info >/dev/null
          bash scripts/janitor-ci-smoke.sh

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree

  os-compat:
    # Linux is the release target. Keep other-host compatibility available
    # explicitly without substituting fake sys.platform values in Linux tests.
    if: github.event_name == 'workflow_dispatch' && inputs.os_compat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          extras: '["web", "messaging", "anthropic"]'
          test-environment: 'true'
      - name: Run the same canonical fork manifest
        shell: bash
        run: python scripts/run_janitor_tests.py -j 2 --file-retries 0 --tb=short
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
