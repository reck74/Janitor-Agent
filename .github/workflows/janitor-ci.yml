name: Janitor CI
on: [push, pull_request]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Run Python tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_janitor_cli.py tests/hermes_cli/test_skin_engine.py -v

  react-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./ui-tui
        run: npm install
      - name: Build local packages (hermes-ink)
        working-directory: ./ui-tui
        run: npm run build --prefix packages/hermes-ink
      - name: Type Check
        working-directory: ./ui-tui
        run: npm run type-check
      - name: Run Tests
        working-directory: ./ui-tui
        run: npm test
