name: Janitor CI
# Pull requests run every gate once; a push runs them only on main (the PR
# already ran them for the branch, and a push+pull_request pair doubled every
# run). workflow_dispatch was added for install-e2e (F6-10) and also runs the
# rest on the chosen branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janitor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Run Python tests
        # The Janitor suite is the tests/janitor/ directory (AGENTS.md
        # directive #11); tests.yml :: test runs the same directory plus the
        # overlay check through scripts/janitor-sync-verify.sh.
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh tests/janitor/

  react-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        # From the root lockfile (ui-tui is an npm workspace): exact versions,
        # nothing rewritten.
        run: npm ci --workspace ui-tui --workspace ui-tui/packages/hermes-ink --no-audit --no-fund
      - name: Build local packages (hermes-ink)
        working-directory: ./ui-tui
        run: npm run build --prefix packages/hermes-ink
      - name: Type Check
        # Script renamed from type-check to typecheck in upstream sync
        # (commit 607078d2c). See MERGE_GUIDE.md §10 for details.
        working-directory: ./ui-tui
        run: npm run typecheck
      - name: Run Tests
        working-directory: ./ui-tui
        run: npm test

  desktop-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@12.2.2
      - name: Install apps/desktop dependencies (no install scripts)
        # Only for esbuild: `build.mjs --check` transpiles every patched file
        # with it. Without it the .tsx files are skipped (Node's type
        # stripping covers .ts only). No Electron download is needed.
        run: npm ci --workspace apps/desktop --ignore-scripts --no-audit --no-fund
      - name: apps/desktop-janitor overlay tests
        run: node --test apps/desktop-janitor/scripts/build.test.mjs
      - name: Brand patches resolve against apps/desktop (drift detector)
        # Fails with the patch id when an upstream sync moves a patch anchor,
        # and when a patched file no longer transpiles.
        shell: bash
        run: |
          node apps/desktop-janitor/scripts/build.mjs --check | tee "$RUNNER_TEMP/brand-check.log"
          # Files that are not TypeScript (a .json registry, a plugin .js) are
          # reported as skipped by design; only a missing transpiler is an error.
          if grep '^skip transpile' "$RUNNER_TEMP/brand-check.log" | grep -qv 'not TypeScript'; then
            echo "::error::build.mjs --check skipped transpilation (esbuild missing)"
            exit 1
          fi

  web-tests:
    name: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Install npm 12
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Check web workspace
        run: npm run check --workspace web
      - name: Build web dashboard
        run: npm run build --workspace web
      - name: Verify dashboard artifact
        run: |
          test -f hermes_cli/web_dist/index.html
          test -d hermes_cli/web_dist/assets
          test -n "$(find hermes_cli/web_dist/assets -type f -print -quit)"

  installer-e2e:
    # Minimal-install smoke for the checked-out Janitor branch. Adapted from
    # upstream tag v2026.8.13's install-e2e.yml — the upstream "install from
    # N prior releases" matrix is dropped (Janitor releases are installed by
    # the desktop app, see janitor-desktop-release.yml). We instead point at
    # the current branch, assert janitor --version
    # prints THE JANITOR banner (per AGENTS.md directive #12), seed a Janitor
    # home with `python -m janitor.seed` (what scripts/install.sh's config
    # stage runs for the desktop app) against an isolated HOME scratch dir,
    # and verify the base home does NOT bring up any opt-in service containers
    # (Honcho local, Firecrawl, Browser, Computer Use, voice/wake) — see
    # AGENTS.md directive #9 (OPTIONAL SKILLS ARE EXPLICIT) and directive #5
    # (janitor- prefix for every container / network / volume / service
    # Janitor owns). Any Docker resource the seed creates here must carry the
    # janitor- prefix and must appear in a snapshot diff to fail the job.
    name: Janitor minimal-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          # Pinned for the same reason as upstream tests-os.yml: unpinned,
          # setup-uv resolves "latest" by fetching a manifest on every job
          # and a transient fetch failure fails the whole job.
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        # Same extras as upstream tests-os.yml so the version of the agent
        # code paths exercised here matches the one Janitor users run.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Assert janitor --version prints the Janitor banner
        # Per AGENTS.md directive #12 (TEST ASSERTION BRANDING) the version
        # banner must say THE JANITOR, not Hermes Agent.
        run: |
          set -euo pipefail
          out="$(uv run janitor --version)"
          echo "$out"
          echo "$out" | grep -qE '^THE JANITOR v'

      - name: Snapshot janitor-* Docker + optional-capability state (before install)
        # Per AGENTS.md directive #5 every container / volume / network Janitor
        # creates must carry the janitor- prefix. The Docker CLI and a
        # reachable daemon are REQUIRED — fail-closed here, not fail-open:
        # if Docker is not available, this job fails, because missing the
        # verification would silently allow an opt-in service container to
        # slip through.
        #
        # AGENTS.md directive #9 (OPTIONAL SKILLS ARE EXPLICIT): we also
        # snapshot the state of optional-capability surfaces (Playwright /
        # Computer Use / voice / wake Python packages and their filesystem
        # markers). The CI step "Install dependencies" above pulls the full
        # `[all]` extras; none of these optional packages are in `[all]`
        # today, but we intentionally compare BEFORE/AFTER state (not
        # "package absent") so this gate stays valid if a future extras
        # change adds any of them.
        env:
          HOME: ${{ runner.temp }}/janitor-e2e-home
        run: |
          set -euo pipefail
          ART="${RUNNER_TEMP}/janitor-e2e"
          mkdir -p "$ART"
          # Docker CLI + daemon: required (fail-closed)
          command -v docker >/dev/null 2>&1 || { echo "::error::docker CLI not found"; exit 1; }
          docker info >/dev/null 2>&1 || { echo "::error::docker daemon not reachable on this runner"; exit 1; }
          # janitor-* Docker resources (sorted; no || true)
          docker ps -a --filter name=janitor- --format '{{.Names}}' \
            | LC_ALL=C sort -u > "$ART/docker-containers.before.txt"
          docker volume ls --filter name=janitor- --format '{{.Name}}' \
            | LC_ALL=C sort -u > "$ART/docker-volumes.before.txt"
          docker network ls --filter name=janitor- --format '{{.Name}}' \
            | LC_ALL=C sort -u > "$ART/docker-networks.before.txt"
          # Optional-capability Python packages. capture_pkg_state writes
          # STATUS=PRESENT + sorted Name/Version lines when uv pip show
          # succeeds, STATUS=ABSENT only when uv pip show returns the
          # "warning: Package(s) not found" sentinel (confirmed absence).
          # Any other uv/grep/parse failure is operational and propagates
          # via set -e — it must NOT collapse to an empty file (which
          # would mask a broken venv or broken uv).
          capture_pkg_state() {
            local pkg="$1" file="$2"
            local err="${file}.err" body="${file}.body"
            : > "$err"; : > "$body"
            # uv pip show exits non-zero for both "package absent" and
            # "uv broken / env broken". ONLY the package-specific
            # absence sentinel — stderr is EXACTLY
            # "warning: Package(s) not found for: <pkg>" after command
            # substitution strips the trailing newline (no extra error
            # lines, no different warning wording, no
            # "for: <other-pkg>" mismatch) — is allowed to produce
            # STATUS=ABSENT. Anything else (different package name in
            # stderr, mixed warning + error, broken PATH, broken venv,
            # parse error) is an OPERATIONAL failure that must
            # propagate under set -e — we do NOT collapse it to
            # STATUS=ABSENT, because that would silently hide a CI
            # environment problem or a legitimate
            # warning-on-top-of-error condition.
            #
            # On the success branch, uv pip show stdout must contain
            # EXACTLY ONE "Name: <name>" line AND EXACTLY ONE
            # "Version: <version>" line. Anything else (missing Name,
            # missing Version, duplicate Name, duplicate Version, or
            # other malformed fields) fails closed under set -e.
            if uv pip show "$pkg" > "$body" 2> "$err"; then
              local name_count version_count state
              name_count=$(grep -cE '^Name:' "$body") || name_count=0
              version_count=$(grep -cE '^Version:' "$body") || version_count=0
              if [ "$name_count" -ne 1 ] || [ "$version_count" -ne 1 ]; then
                echo "::error::uv pip show $pkg output must contain exactly one Name and one Version line (got Name=$name_count Version=$version_count):" >&2
                cat "$body" >&2
                rm -f "$body" "$err"; exit 1
              fi
              if ! state=$(grep -E '^(Name|Version):' "$body" | LC_ALL=C sort -k1,1); then
                echo "::error::failed to extract Name/Version from uv pip show $pkg output:" >&2
                cat "$body" >&2
                rm -f "$body" "$err"; exit 1
              fi
              {
                printf 'STATUS=PRESENT\n'
                printf '%s\n' "$state"
              } > "$file"
              rm -f "$body" "$err"
            else
              local actual expected
              actual="$(cat "$err")"
              expected="warning: Package(s) not found for: $pkg"
              if [ "$expected" = "$actual" ]; then
                # Confirmed absent — only this exact stderr shape (one
                # line, package-specific, no extras) writes
                # STATUS=ABSENT. Command substitution's trailing-newline
                # stripping gives a clean equality test against the
                # expected diagnostic; any second stderr line keeps
                # actual != expected and routes to the operational-error
                # branch below.
                printf 'STATUS=ABSENT\n' > "$file"
                rm -f "$body" "$err"
              else
                # Operational error: different pkg in stderr, extra
                # stderr lines (mixed warning + error), broken uv,
                # broken env, parse failure, etc.
                echo "::error::uv pip show $pkg stderr does not match package-specific absence sentinel (treating as operational error):" >&2
                echo "  expected: '$expected'" >&2
                echo "  actual:   '$actual'" >&2
                rm -f "$body" "$err"; exit 1
              fi
            fi
          }
          capture_pkg_state playwright      "$ART/pkg-playwright.before.txt"
          capture_pkg_state faster-whisper  "$ART/pkg-faster-whisper.before.txt"
          capture_pkg_state openwakeword    "$ART/pkg-openwakeword.before.txt"
          # Filesystem markers for Browser (Playwright cache) and Computer
          # Use (cua-driver home — see hermes_cli/tools_config.py:1142).
          # capture_dir_listing writes STATUS=PRESENT + sorted listing of
          # EVERY entry type (file, dir, symlink, etc.) when the directory
          # exists, or STATUS=ABSENT when it does not. find errors and
          # partial captures (non-empty stderr) propagate as fail-closed.
          capture_dir_listing() {
            local dir="$1" file="$2"
            if [ -d "$dir" ]; then
              # PRESENT — capture every entry (file, directory, symlink,
              # block, char, fifo, socket, etc.), not just regular files.
              # -mindepth 1 skips the root itself; -printf '%y %p\n' tags
              # each entry with its type ('f'/'d'/'l'/etc) so a directory-
              # only or symlink-only tree still produces a deterministic
              # listing (a present-but-empty directory becomes
              # "STATUS=PRESENT\n" with an empty body, distinct from
              # "STATUS=ABSENT"). find errors propagate under set -e
              # (no 2>/dev/null suppression); we also fail closed if find
              # emits any stderr output, since a partial capture would
              # produce a misleading diff downstream.
              local err="${file}.err" body="${file}.body"
              : > "$err"; : > "$body"
              if ! find "$dir" -mindepth 1 -printf '%y %p\n' > "$body" 2> "$err"; then
                echo "::error::find exited non-zero for $dir:" >&2
                cat "$err" >&2
                rm -f "$body" "$err"; exit 1
              fi
              if [ -s "$err" ]; then
                echo "::error::find emitted errors for $dir (partial capture, fail-closed):" >&2
                cat "$err" >&2
                rm -f "$body" "$err"; exit 1
              fi
              {
                printf 'STATUS=PRESENT\n'
                LC_ALL=C sort -k2 "$body"
              } > "$file"
              rm -f "$body" "$err"
            else
              # ABSENT — directory does not exist (or is not a directory).
              # Sentinel distinguishes from a present-but-empty directory.
              printf 'STATUS=ABSENT\n' > "$file"
            fi
          }
          capture_dir_listing "$HOME/.cache/ms-playwright" "$ART/fs-ms-playwright.before.txt"
          capture_dir_listing "$HOME/.cua-driver"          "$ART/fs-cua-driver.before.txt"

      - name: Seed a minimal Janitor home
        # HOME / HERMES_HOME are redirected to an isolated scratch dir under
        # ${RUNNER_TEMP}, so nothing lands in the runner's real $HOME. The
        # seed needs no provider key and never deploys an optional service
        # (directives #8 and #9). Any failure propagates (no `|| true`).
        env:
          HOME: ${{ runner.temp }}/janitor-e2e-home
          HERMES_HOME: ${{ runner.temp }}/janitor-e2e
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          uv run python -m janitor.seed --home "${{ runner.temp }}/janitor-e2e"

      - name: Assert minimal base artifacts were deployed
        run: |
          set -euo pipefail
          JH="${{ runner.temp }}/janitor-e2e"
          test -f "$JH/config.yaml"
          test -f "$JH/SOUL.md"
          test -f "$JH/skins/sentry-janitor.yaml"
          test -f "$JH/.no-bundled-skills"
          test -f "$JH/.layout_version"
          test ! -e "$JH/.env"
          echo "Minimal install artifacts: OK"

      - name: Snapshot state (after install) and assert no new Docker resource and no optional-capability state change
        # Re-runs the same captures the "before" step wrote, then computes the
        # diff against the before snapshot files. Any new janitor-*
        # container / volume / network OR any change in optional-capability
        # state is a policy violation. `comm` runs under set -euo pipefail
        # and its non-zero exit (e.g. missing input file) propagates; we do
        # NOT use `|| true` or `set +e` in this enforcement path.
        env:
          HOME: ${{ runner.temp }}/janitor-e2e-home
        run: |
          set -euo pipefail
          ART="${RUNNER_TEMP}/janitor-e2e"
          docker ps -a --filter name=janitor- --format '{{.Names}}' \
            | LC_ALL=C sort -u > "$ART/docker-containers.after.txt"
          docker volume ls --filter name=janitor- --format '{{.Name}}' \
            | LC_ALL=C sort -u > "$ART/docker-volumes.after.txt"
          docker network ls --filter name=janitor- --format '{{.Name}}' \
            | LC_ALL=C sort -u > "$ART/docker-networks.after.txt"
          capture_pkg_state() {
            local pkg="$1" file="$2"
            local err="${file}.err" body="${file}.body"
            : > "$err"; : > "$body"
            # uv pip show exits non-zero for both "package absent" and
            # "uv broken / env broken". ONLY the package-specific
            # absence sentinel — stderr is EXACTLY
            # "warning: Package(s) not found for: <pkg>" after command
            # substitution strips the trailing newline (no extra error
            # lines, no different warning wording, no
            # "for: <other-pkg>" mismatch) — is allowed to produce
            # STATUS=ABSENT. Anything else (different package name in
            # stderr, mixed warning + error, broken PATH, broken venv,
            # parse error) is an OPERATIONAL failure that must
            # propagate under set -e — we do NOT collapse it to
            # STATUS=ABSENT, because that would silently hide a CI
            # environment problem or a legitimate
            # warning-on-top-of-error condition.
            #
            # On the success branch, uv pip show stdout must contain
            # EXACTLY ONE "Name: <name>" line AND EXACTLY ONE
            # "Version: <version>" line. Anything else (missing Name,
            # missing Version, duplicate Name, duplicate Version, or
            # other malformed fields) fails closed under set -e.
            if uv pip show "$pkg" > "$body" 2> "$err"; then
              local name_count version_count state
              name_count=$(grep -cE '^Name:' "$body") || name_count=0
              version_count=$(grep -cE '^Version:' "$body") || version_count=0
              if [ "$name_count" -ne 1 ] || [ "$version_count" -ne 1 ]; then
                echo "::error::uv pip show $pkg output must contain exactly one Name and one Version line (got Name=$name_count Version=$version_count):" >&2
                cat "$body" >&2
                rm -f "$body" "$err"; exit 1
              fi
              if ! state=$(grep -E '^(Name|Version):' "$body" | LC_ALL=C sort -k1,1); then
                echo "::error::failed to extract Name/Version from uv pip show $pkg output:" >&2
                cat "$body" >&2
                rm -f "$body" "$err"; exit 1
              fi
              {
                printf 'STATUS=PRESENT\n'
                printf '%s\n' "$state"
              } > "$file"
              rm -f "$body" "$err"
            else
              local actual expected
              actual="$(cat "$err")"
              expected="warning: Package(s) not found for: $pkg"
              if [ "$expected" = "$actual" ]; then
                # Confirmed absent — only this exact stderr shape (one
                # line, package-specific, no extras) writes
                # STATUS=ABSENT. Command substitution's trailing-newline
                # stripping gives a clean equality test against the
                # expected diagnostic; any second stderr line keeps
                # actual != expected and routes to the operational-error
                # branch below.
                printf 'STATUS=ABSENT\n' > "$file"
                rm -f "$body" "$err"
              else
                # Operational error: different pkg in stderr, extra
                # stderr lines (mixed warning + error), broken uv,
                # broken env, parse failure, etc.
                echo "::error::uv pip show $pkg stderr does not match package-specific absence sentinel (treating as operational error):" >&2
                echo "  expected: '$expected'" >&2
                echo "  actual:   '$actual'" >&2
                rm -f "$body" "$err"; exit 1
              fi
            fi
          }
          capture_pkg_state playwright      "$ART/pkg-playwright.after.txt"
          capture_pkg_state faster-whisper  "$ART/pkg-faster-whisper.after.txt"
          capture_pkg_state openwakeword    "$ART/pkg-openwakeword.after.txt"
          capture_dir_listing() {
            local dir="$1" file="$2"
            if [ -d "$dir" ]; then
              # PRESENT — capture every entry (file, directory, symlink,
              # block, char, fifo, socket, etc.), not just regular files.
              # -mindepth 1 skips the root itself; -printf '%y %p\n' tags
              # each entry with its type ('f'/'d'/'l'/etc) so a directory-
              # only or symlink-only tree still produces a deterministic
              # listing (a present-but-empty directory becomes
              # "STATUS=PRESENT\n" with an empty body, distinct from
              # "STATUS=ABSENT"). find errors propagate under set -e
              # (no 2>/dev/null suppression); we also fail closed if find
              # emits any stderr output, since a partial capture would
              # produce a misleading diff downstream.
              local err="${file}.err" body="${file}.body"
              : > "$err"; : > "$body"
              if ! find "$dir" -mindepth 1 -printf '%y %p\n' > "$body" 2> "$err"; then
                echo "::error::find exited non-zero for $dir:" >&2
                cat "$err" >&2
                rm -f "$body" "$err"; exit 1
              fi
              if [ -s "$err" ]; then
                echo "::error::find emitted errors for $dir (partial capture, fail-closed):" >&2
                cat "$err" >&2
                rm -f "$body" "$err"; exit 1
              fi
              {
                printf 'STATUS=PRESENT\n'
                LC_ALL=C sort -k2 "$body"
              } > "$file"
              rm -f "$body" "$err"
            else
              # ABSENT — directory does not exist (or is not a directory).
              # Sentinel distinguishes from a present-but-empty directory.
              printf 'STATUS=ABSENT\n' > "$file"
            fi
          }
          capture_dir_listing "$HOME/.cache/ms-playwright" "$ART/fs-ms-playwright.after.txt"
          capture_dir_listing "$HOME/.cua-driver"          "$ART/fs-cua-driver.after.txt"
          # Compute new Docker resources (no || true, no set +e)
          comm -13 "$ART/docker-containers.before.txt" "$ART/docker-containers.after.txt" \
            > "$ART/new-containers.txt"
          comm -13 "$ART/docker-volumes.before.txt" "$ART/docker-volumes.after.txt" \
            > "$ART/new-volumes.txt"
          comm -13 "$ART/docker-networks.before.txt" "$ART/docker-networks.after.txt" \
            > "$ART/new-networks.txt"
          # Firecrawl deploy-script markers in $JH (per janitor/skills/services/janitor-firecrawl/scripts/deploy.sh)
          JH="${{ runner.temp }}/janitor-e2e"
          fail=0
          if [ -s "$ART/new-containers.txt" ] || [ -s "$ART/new-volumes.txt" ] || [ -s "$ART/new-networks.txt" ]; then
            echo "::error::New janitor-* Docker resources appeared after seeding the minimal home:"
            echo "  new_containers: $(tr '\n' ' ' < "$ART/new-containers.txt" 2>/dev/null)none"
            echo "  new_volumes:    $(tr '\n' ' ' < "$ART/new-volumes.txt" 2>/dev/null)none"
            echo "  new_networks:   $(tr '\n' ' ' < "$ART/new-networks.txt" 2>/dev/null)none"
            fail=1
          fi
          if [ -f "$JH/docker/firecrawl.env" ] || [ -f "$JH/docker/firecrawl-compose.yml" ]; then
            echo "::error::Firecrawl deploy.sh markers present in $JH/docker/"
            ls -la "$JH/docker/" 2>/dev/null || true
            fail=1
          fi
          # Optional-capability surfaces must be UNCHANGED. diff returns 1
          # when files differ — that is the expected failure we want to
          # detect, so we wrap it in `if ! ...; then`.
          for surface in \
            pkg-playwright \
            pkg-faster-whisper \
            pkg-openwakeword \
            fs-ms-playwright \
            fs-cua-driver; do
            if ! diff -q "${ART}/${surface}.before.txt" "${ART}/${surface}.after.txt" >/dev/null 2>&1; then
              echo "::error::Optional-capability state changed: ${surface}"
              diff "${ART}/${surface}.before.txt" "${ART}/${surface}.after.txt" || true
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "No new janitor-* Docker resources: OK"
          echo "No Firecrawl deploy markers in \$JH: OK"
          echo "Optional-capability state unchanged: OK"

  os-compat:
    # OS-specific portability smoke for the Janitor suite (tests/janitor/).
    # Adapted from upstream tag v2026.9.24's tests-os.yml — preserves the macOS + Windows
    # matrix, the uv / Python 3.11 / extras setup, the retry composite, and
    # the cache-pruning step. The test invocation diverges from upstream on
    # purpose: upstream runs OS-marked tests via the macos_only /
    # windows_only pytest markers; Janitor's tests are platform-agnostic
    # Python, so we want to exercise them on every host. Per the human
    # amendment (recorded in task-11-brief.md), the two runners dispatch
    # differently:
    #   - macos-latest: scripts/run_tests.sh (Janitor's canonical runner —
    #     per-file subprocess isolation, TZ=UTC, env blanking, venv probe).
    #   - windows-latest: .venv/Scripts/python.exe -m pytest directly,
    #     because scripts/run_tests.sh uses POSIX-only process-group handling
    #     that does not work natively on Windows runners.
    # Both legs run the whole tests/janitor/ directory (AGENTS.md directive
    # #11); tests marked linux_only are skipped by tests/conftest.py.
    name: Janitor tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          # Pinned for the same reason as upstream tests-os.yml.
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Run Janitor tests (macOS)
        # Same tests/janitor/ suite as the PR gate, dispatched through Janitor's
        # runner so per-file subprocess isolation + venv/TZ/env blanks are
        # honored. Wrapper / skin / HOME assertions live inside these tests;
        # running them on macOS proves the Janitor-specific code paths work
        # outside ubuntu-latest.
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          scripts/run_tests.sh tests/janitor/ -v

      - name: Run Janitor tests (Windows)
        # Direct .venv/Scripts/python.exe -m pytest invocation (per the human
        # amendment in task-11-brief.md) — scripts/run_tests_parallel.py uses
        # POSIX-only process-group handling and does not work natively on
        # Windows. The suite and the env blanks / verbosity options are
        # identical to the macOS leg.
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -euo pipefail
          # Windows Python defaults to cp1252 for Path.read_text() without an
          # explicit encoding; the fork's scripts/tests carry UTF-8 (arrows,
          # emoji). UTF-8 mode makes every read_text() site decode as UTF-8.
          export PYTHONUTF8=1
          # Put Git Bash ahead of System32 so pytest subprocesses spawning
          # `bash` get Git Bash instead of the WSL launcher (which exits 1
          # with "no installed distributions" on hosted runners).
          export PATH="/c/Program Files/Git/bin:$PATH"
          .venv/Scripts/python.exe -m pytest tests/janitor/ --tb=short -v

  # F6-10 (docs/janitor/plans/janitor-desktop-app.md, Fase 6): whether
  # install-e2e has to run, and which branch + commit it installs. The
  # installers clone reck74/Janitor-Agent (REPO_URL_* in scripts/install.sh,
  # $RepoUrl* in scripts/install.ps1) with `--branch`, then pin `--commit`, so
  # the branch must exist there: a PR from another repository, a run in a
  # copy of this repository and a plain push are skipped (a push of these
  # paths was already covered by its PR). Runs on workflow_dispatch, and on a
  # pull_request that touches the installer, the engine or the seed.
  install-e2e-changes:
    name: install-e2e (needed?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      branch: ${{ steps.decide.outputs.branch }}
      commit: ${{ steps.decide.outputs.commit }}
    steps:
      - name: Checkout the PR merge commit (only its parents are needed)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # refs/pull/N/merge: HEAD^1 is the base tip, so HEAD^1..HEAD is what
          # the PR changes. Trees only; no working tree beyond .github.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=false
          branch=""
          commit=""
          if [ "$REPO" != "reck74/Janitor-Agent" ]; then
            echo "::notice::install-e2e skipped: the installers clone reck74/Janitor-Agent, not $REPO"
          else
            case "$EVENT" in
              workflow_dispatch)
                run=true
                branch="$REF_NAME"
                commit="$SHA"
                ;;
              pull_request)
                if [ "$PR_HEAD_REPO" != "$REPO" ]; then
                  echo "::notice::install-e2e skipped: the PR branch lives in $PR_HEAD_REPO, which the installers do not clone"
                else
                  changed="$(git diff --name-only HEAD^1 HEAD)"
                  printf '%s\n' "$changed"
                  if grep -qE '^(scripts/install\.(sh|ps1)$|scripts/desktop-update/|janitor/|assets/janitor/|pyproject\.toml$|uv\.lock$|\.github/workflows/janitor-ci\.yml$)' <<<"$changed"; then
                    run=true
                  else
                    echo "::notice::install-e2e skipped: no installer, engine or seed file changed"
                  fi
                  # Not the merge commit: it exists only under refs/pull/, and
                  # the installer clones the PR branch and pins its head.
                  branch="$PR_HEAD_REF"
                  commit="$PR_HEAD_SHA"
                fi
                ;;
              *)
                echo "::notice::install-e2e runs on pull_request and workflow_dispatch only"
                ;;
            esac
          fi
          {
            echo "run=$run"
            echo "branch=$branch"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "run=$run branch=$branch commit=$commit"

  # F6-10: the REAL engine install on Windows and macOS, driven exactly like
  # the desktop app's first run (apps/desktop/electron/bootstrap-runner.ts):
  # the platform installer is asked for its stage manifest and every stage runs
  # in its own process with the non-interactive + JSON flags and the pin args
  # (branch, and the commit only on a fresh install), each stage judged by its
  # JSON result frame. The home is a temporary ~/.janitor: HOME (macOS) and
  # USERPROFILE (Windows) point at $RUNNER_TEMP/home, because the `janitor`
  # launcher always runs on ~/.janitor (janitor/home.py) and nothing here may
  # touch the runner's real home. HERMES_HOME is never inherited: the drivers
  # set it the way the app does (spawnBash / spawnPowerShell) and the checks
  # unset it. Afterwards: venv + launcher + `janitor --version` (THE JANITOR,
  # directive #12), the seeded home (directive #8), no Playwright browser
  # (decision 2.10), `janitor update --check`, and a second installer pass that
  # must leave config.yaml and SOUL.md byte-identical. Windows runs everything
  # under Windows PowerShell 5.1 (what the app spawns) with PYTHONUTF8 unset, so
  # encoding bugs surface instead of being masked as in os-compat.
  install-e2e:
    name: install-e2e (${{ matrix.os }})
    needs: install-e2e-changes
    if: needs.install-e2e-changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    env:
      E2E_BRANCH: ${{ needs.install-e2e-changes.outputs.branch }}
      E2E_COMMIT: ${{ needs.install-e2e-changes.outputs.commit }}
    steps:
      - name: Checkout the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The same commit the installer clones, so the scripts run here and
          # the assets compared below are the installed ones.
          ref: ${{ needs.install-e2e-changes.outputs.commit }}
          filter: blob:none
          sparse-checkout: |
            scripts
            assets/janitor
          persist-credentials: false

      - name: Parse install.ps1 and desktop-update/windows.ps1 with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Host "::error::expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
            exit 1
          }
          $failed = $false
          foreach ($rel in @('scripts\install.ps1', 'scripts\desktop-update\windows.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE $rel
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host ("::error file={0},line={1},col={2}::{3}" -f ($rel -replace '\\', '/'), $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)
              }
              Write-Host "${rel}: $($errors.Count) syntax error(s)"
            } else {
              Write-Host "${rel}: OK"
            }
          }
          if ($failed) { exit 1 }
          exit 0

      - name: Write the app-like installer drivers
        shell: bash
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP"
          [ "$RUNNER_OS" != "Windows" ] || rt="$(cygpath -u "$RUNNER_TEMP")"
          d="$rt/e2e"
          mkdir -p "$d" "$rt/home" "$rt/install-e2e-logs"
          # POSIX: what bootstrap-runner.ts runs for install.sh. Usage:
          #   install-like-app.sh <pass> [--commit SHA]
          cat > "$d/install-like-app.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          pass="$1"; shift
          export HOME="$RUNNER_TEMP/home"
          unset HERMES_HOME HERMES_INSTALL_DIR PYTHONPATH PYTHONHOME
          JH="$HOME/.janitor"
          logs="$RUNNER_TEMP/install-e2e-logs"
          mkdir -p "$logs"
          # buildPosixPinArgs: --dir, --hermes-home, --branch, then --commit on a fresh install.
          pin=(--dir "$JH/hermes-agent" --hermes-home "$JH" --branch "$E2E_BRANCH" "$@")
          installer="$GITHUB_WORKSPACE/scripts/install.sh"
          command -v jq >/dev/null || { echo "::error::jq is not installed on this runner"; exit 1; }
          if ! HERMES_HOME="$JH" bash "$installer" --manifest "${pin[@]}" </dev/null > "$logs/$pass-manifest.log" 2>&1; then
            echo "::error::$pass: install.sh --manifest failed"
            cat "$logs/$pass-manifest.log"
            exit 1
          fi
          manifest="$(grep '^{' "$logs/$pass-manifest.log" | tail -n 1 || true)"
          stages="$(jq -r '.stages[].name' <<<"$manifest" || true)"
          if [ -z "$stages" ]; then
            echo "::error::$pass: install.sh --manifest returned no stages"
            cat "$logs/$pass-manifest.log"
            exit 1
          fi
          echo "$pass: stages:" $stages
          for stage in $stages; do
            out="$logs/$pass-$stage.log"
            echo "::group::$pass: install.sh --stage $stage"
            set +e
            HERMES_HOME="$JH" bash "$installer" --stage "$stage" --non-interactive --json "${pin[@]}" </dev/null > "$out" 2>&1
            code=$?
            set -e
            cat "$out"
            echo "::endgroup::"
            frame="$(grep '^{"ok":' "$out" | tail -n 1 || true)"
            if [ -z "$frame" ]; then
              echo "::error::$pass: stage $stage produced no JSON result frame (exit $code)"
              exit 1
            fi
            if [ "$(jq -r '.ok' <<<"$frame")" != "true" ] || [ "$code" -ne 0 ]; then
              echo "::error::$pass: stage $stage failed (exit $code): $frame"
              exit 1
            fi
            if [ "$(jq -r '.skipped' <<<"$frame")" = "true" ]; then
              echo "::notice::$pass: stage $stage skipped: $(jq -r '.reason // "no reason"' <<<"$frame")"
            fi
          done
          echo "$pass: every stage succeeded"
          EOF
          # Windows: what bootstrap-runner.ts runs for install.ps1, from Windows
          # PowerShell 5.1. Usage: install-like-app.ps1 -Pass <pass> [-Commit SHA]
          cat > "$d/install-like-app.ps1" <<'EOF'
          param([Parameter(Mandatory = $true)][string]$Pass, [string]$Commit = '')
          $ErrorActionPreference = 'Continue'
          $homeDir = Join-Path $env:RUNNER_TEMP 'home'
          $env:USERPROFILE = $homeDir
          $env:HOME = $homeDir
          foreach ($name in @('HERMES_HOME', 'PYTHONUTF8', 'PYTHONIOENCODING', 'PYTHONPATH', 'PYTHONHOME')) {
            Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
          }
          $jh = Join-Path $homeDir '.janitor'
          $logs = Join-Path $env:RUNNER_TEMP 'install-e2e-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $installer = Join-Path $env:GITHUB_WORKSPACE 'scripts\install.ps1'
          # buildPinArgs: -Commit only on a fresh install, then -Branch. The app
          # passes the home as HERMES_HOME (spawnPowerShell), not -HermesHome.
          $pin = @()
          if ($Commit) { $pin += @('-Commit', $Commit) }
          $pin += @('-Branch', $env:E2E_BRANCH)
          $env:HERMES_HOME = $jh

          function Invoke-Installer([string]$Label, [string[]]$InstallerArgs) {
            $all = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $installer) + $InstallerArgs
            $lines = @(& $ps @all 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            [System.IO.File]::WriteAllLines((Join-Path $logs "$Pass-$Label.log"), [string[]]$lines)
            return @{ Lines = $lines; Code = $code }
          }

          function Get-LastJson([string[]]$Lines, [string]$Property) {
            for ($i = $Lines.Count - 1; $i -ge 0; $i--) {
              $l = $Lines[$i].Trim()
              if (-not $l.StartsWith('{')) { continue }
              try { $o = $l | ConvertFrom-Json -ErrorAction Stop } catch { continue }
              if ($o.PSObject.Properties.Name -contains $Property) { return $o }
            }
            return $null
          }

          $m = Invoke-Installer 'manifest' (@('-Manifest') + $pin)
          $manifest = Get-LastJson $m.Lines 'stages'
          if (-not $manifest -or @($manifest.stages).Count -eq 0) {
            Write-Host "::error::${Pass}: install.ps1 -Manifest returned no stages (exit $($m.Code))"
            $m.Lines | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host ("${Pass}: stages: " + ((@($manifest.stages) | ForEach-Object { $_.name }) -join ' '))
          foreach ($stage in @($manifest.stages)) {
            $name = [string]$stage.name
            Write-Host "::group::${Pass}: install.ps1 -Stage $name"
            $r = Invoke-Installer $name (@('-Stage', $name, '-NonInteractive', '-Json') + $pin)
            $r.Lines | ForEach-Object { Write-Host $_ }
            Write-Host '::endgroup::'
            $frame = Get-LastJson $r.Lines 'ok'
            if (-not $frame) {
              Write-Host "::error::${Pass}: stage $name produced no JSON result frame (exit $($r.Code))"
              exit 1
            }
            if ($frame.ok -ne $true -or $r.Code -ne 0) {
              Write-Host "::error::${Pass}: stage $name failed (exit $($r.Code)): $($frame.reason)"
              exit 1
            }
            if ($frame.skipped -eq $true) {
              Write-Host "::notice::${Pass}: stage $name skipped: $($frame.reason)"
            }
          }
          Write-Host "${Pass}: every stage succeeded"
          exit 0
          EOF
          ls -la "$d"

      - name: Snapshot the Playwright browser caches (before)
        shell: bash
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP"
          [ "$RUNNER_OS" != "Windows" ] || rt="$(cygpath -u "$RUNNER_TEMP")"
          logs="$rt/install-e2e-logs"
          # The runner's real Playwright cache (this step does not move HOME):
          # a browser download that ignored the temporary home would land here.
          if [ "$RUNNER_OS" = "Windows" ]; then
            real="$(cygpath -u "$LOCALAPPDATA")/ms-playwright"
          else
            real="$HOME/Library/Caches/ms-playwright"
          fi
          echo "$real" > "$logs/playwright-real-cache.path"
          if [ -d "$real" ]; then
            (cd "$real" && find . -maxdepth 1 | LC_ALL=C sort) > "$logs/playwright-real-cache.before"
          else
            echo ABSENT > "$logs/playwright-real-cache.before"
          fi
          cat "$logs/playwright-real-cache.before"

      - name: Install the engine like the app (macOS, install.sh by stages)
        if: runner.os == 'macOS'
        shell: bash
        run: bash "$RUNNER_TEMP/e2e/install-like-app.sh" first --commit "$E2E_COMMIT"

      - name: Install the engine like the app (Windows, install.ps1 by stages)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RUNNER_TEMP 'e2e\install-like-app.ps1') -Pass first -Commit $env:E2E_COMMIT
          exit $LASTEXITCODE

      - name: Check the installation (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          unset HERMES_HOME
          JH="$HOME/.janitor"
          ROOT="$JH/hermes-agent"
          logs="$RUNNER_TEMP/install-e2e-logs"
          fail=0
          err() { echo "::error::$*"; fail=1; }
          head_sha="$(git -C "$ROOT" rev-parse HEAD)"
          echo "installed commit: $head_sha"
          [ "$head_sha" = "$E2E_COMMIT" ] || echo "::warning::installed $head_sha, expected $E2E_COMMIT (the branch moved during the run?)"
          [ -x "$ROOT/venv/bin/python" ] || err "no venv at $ROOT/venv"
          [ -x "$ROOT/venv/bin/janitor" ] || err "no venv/bin/janitor"
          launcher="$HOME/.local/bin/janitor"
          [ -x "$launcher" ] || { err "the path stage left no launcher at $launcher"; launcher="$ROOT/venv/bin/janitor"; }
          out="$("$launcher" --version 2>&1)" || err "janitor --version exited $?"
          printf '%s\n' "$out" | tee "$logs/janitor-version.txt"
          grep -qE '^THE JANITOR v' <<<"$out" || err "janitor --version does not print THE JANITOR v"
          [ -f "$JH/config.yaml" ] || err "no $JH/config.yaml"
          [ -f "$JH/.no-bundled-skills" ] || err "no $JH/.no-bundled-skills"
          if [ ! -f "$JH/SOUL.md" ]; then
            err "no $JH/SOUL.md"
          elif ! cmp -s "$JH/SOUL.md" "$GITHUB_WORKSPACE/assets/janitor/SOUL.md"; then
            err "SOUL.md is not assets/janitor/SOUL.md"
            diff "$GITHUB_WORKSPACE/assets/janitor/SOUL.md" "$JH/SOUL.md" | head -20 || true
          fi
          set +e
          out="$("$launcher" update --check 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out" | tee "$logs/janitor-update-check.txt"
          [ "$code" -eq 0 ] || err "janitor update --check exited $code"
          grep -qE 'Ya tienes la|Todav|Hay una versi' <<<"$out" || err "janitor update --check printed none of its known results"
          exit "$fail"

      - name: Check the installation (Windows, PYTHONUTF8 unset)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new() } catch { }
          $homeDir = Join-Path $env:RUNNER_TEMP 'home'
          $env:USERPROFILE = $homeDir
          $env:HOME = $homeDir
          foreach ($name in @('HERMES_HOME', 'PYTHONUTF8', 'PYTHONIOENCODING')) {
            Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
          }
          $jh = Join-Path $homeDir '.janitor'
          $root = Join-Path $jh 'hermes-agent'
          $logs = Join-Path $env:RUNNER_TEMP 'install-e2e-logs'
          # A list, not a flag: GitHub dot-sources this script, so scope
          # modifiers on a plain variable are easy to get wrong.
          $failures = New-Object System.Collections.ArrayList
          function Fail([string]$Message) { Write-Host "::error::$Message"; [void]$failures.Add($Message) }

          $headSha = (& git -C $root rev-parse HEAD 2>$null | Out-String).Trim()
          Write-Host "installed commit: $headSha"
          if ($headSha -ne $env:E2E_COMMIT) { Write-Host "::warning::installed $headSha, expected $($env:E2E_COMMIT) (the branch moved during the run?)" }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'venv\Scripts\python.exe'))) { Fail "no venv at $root\venv" }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'venv\Scripts\janitor.exe'))) { Fail 'no venv\Scripts\janitor.exe' }
          # Set-PathVariable stages the launcher in $HermesHome\bin (.exe, or .cmd for a relocatable venv).
          $launcher = @('janitor.exe', 'janitor.cmd') | ForEach-Object { Join-Path $jh "bin\$_" } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $launcher) {
            Fail "the path stage left no launcher in $jh\bin"
            $launcher = Join-Path $root 'venv\Scripts\janitor.exe'
          }
          Write-Host "launcher: $launcher"

          $out = @(& $launcher --version 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $text = $out -join "`n"
          Write-Host $text
          [System.IO.File]::WriteAllText((Join-Path $logs 'janitor-version.txt'), $text)
          if ($code -ne 0) { Fail "janitor --version exited $code" }
          if ($text -notmatch '(?m)^THE JANITOR v') { Fail 'janitor --version does not print THE JANITOR v' }

          if (-not (Test-Path -LiteralPath (Join-Path $jh 'config.yaml'))) { Fail "no $jh\config.yaml" }
          if (-not (Test-Path -LiteralPath (Join-Path $jh '.no-bundled-skills'))) { Fail "no $jh\.no-bundled-skills" }
          $soul = Join-Path $jh 'SOUL.md'
          if (-not (Test-Path -LiteralPath $soul)) {
            Fail "no $soul"
          } else {
            $expected = [System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE 'assets\janitor\SOUL.md'))
            $actual = [System.IO.File]::ReadAllBytes($soul)
            if ([Convert]::ToBase64String($expected) -ne [Convert]::ToBase64String($actual)) { Fail 'SOUL.md is not assets/janitor/SOUL.md' }
          }

          $out = @(& $launcher update --check 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $text = $out -join "`n"
          Write-Host $text
          [System.IO.File]::WriteAllText((Join-Path $logs 'janitor-update-check.txt'), $text)
          if ($code -ne 0) { Fail "janitor update --check exited $code" }
          if ($text -notmatch 'Ya tienes la|Todav|Hay una versi') { Fail 'janitor update --check printed none of its known results' }

          if ($failures.Count -gt 0) { exit 1 }
          exit 0

      - name: No Playwright browser was installed
        # Decision 2.10 / F1-29: the base install ships no browser. Nothing
        # named ms-playwright under the temporary home (node_modules aside: a
        # package may carry the name, a browser download never lands there),
        # and the runner's real cache unchanged.
        shell: bash
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP"
          [ "$RUNNER_OS" != "Windows" ] || rt="$(cygpath -u "$RUNNER_TEMP")"
          logs="$rt/install-e2e-logs"
          fail=0
          found="$(find "$rt/home" -path '*/node_modules' -prune -o -type d -name ms-playwright -print)"
          if [ -n "$found" ]; then
            echo "::error::ms-playwright directories under the temporary home: $found"
            fail=1
          fi
          real="$(cat "$logs/playwright-real-cache.path")"
          if [ -d "$real" ]; then
            (cd "$real" && find . -maxdepth 1 | LC_ALL=C sort) > "$logs/playwright-real-cache.after"
          else
            echo ABSENT > "$logs/playwright-real-cache.after"
          fi
          if ! cmp -s "$logs/playwright-real-cache.before" "$logs/playwright-real-cache.after"; then
            echo "::error::the runner's Playwright cache changed: $real"
            diff "$logs/playwright-real-cache.before" "$logs/playwright-real-cache.after" || true
            fail=1
          fi
          exit "$fail"

      - name: Second installer pass on the installed home (idempotency, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          JH="$RUNNER_TEMP/home/.janitor"
          before="$(shasum -a 256 "$JH/config.yaml" "$JH/SOUL.md")"
          # An existing checkout: the app no longer passes --commit (pinCommit=false).
          bash "$RUNNER_TEMP/e2e/install-like-app.sh" second
          after="$(shasum -a 256 "$JH/config.yaml" "$JH/SOUL.md")"
          printf 'before:\n%s\nafter:\n%s\n' "$before" "$after"
          if [ "$before" != "$after" ]; then
            echo "::error::the second install pass changed config.yaml or SOUL.md"
            exit 1
          fi
          [ -f "$JH/.no-bundled-skills" ] || { echo "::error::.no-bundled-skills disappeared"; exit 1; }
          version="$(env -u HERMES_HOME HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/home/.local/bin/janitor" --version 2>&1)"
          printf '%s\n' "$version"
          grep -qE '^THE JANITOR v' <<<"$version" || { echo "::error::janitor --version broke after the second pass"; exit 1; }

      - name: Second installer pass on the installed home (idempotency, Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $jh = Join-Path $env:RUNNER_TEMP 'home\.janitor'
          $files = @('config.yaml', 'SOUL.md') | ForEach-Object { Join-Path $jh $_ }
          $before = ($files | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash }) -join ' '
          # An existing checkout: the app no longer passes -Commit (pinCommit=false).
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RUNNER_TEMP 'e2e\install-like-app.ps1') -Pass second
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = ($files | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash }) -join ' '
          Write-Host "before: $before"
          Write-Host "after:  $after"
          if ($before -ne $after) {
            Write-Host '::error::the second install pass changed config.yaml or SOUL.md'
            exit 1
          }
          if (-not (Test-Path -LiteralPath (Join-Path $jh '.no-bundled-skills'))) {
            Write-Host '::error::.no-bundled-skills disappeared'
            exit 1
          }
          exit 0

      - name: Upload the installer output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: install-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/install-e2e-logs
            ${{ runner.temp }}/home/.janitor/logs
          # The engine's logs live under the hidden .janitor; only that logs
          # directory is listed (never .env or config).
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
