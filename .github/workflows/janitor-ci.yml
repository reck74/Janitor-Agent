name: Janitor CI
on: [push, pull_request]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Run Python tests
        # tests/hermes_cli/test_skin_engine.py was removed by upstream sync
        # (commit 607078d2c). Replaced with test_janitor_update_core.py to
        # maintain 2-file coverage. See MERGE_GUIDE.md §10 for details.
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_janitor_cli.py tests/test_janitor_update_core.py -v

  react-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./ui-tui
        run: npm install
      - name: Build local packages (hermes-ink)
        working-directory: ./ui-tui
        run: npm run build --prefix packages/hermes-ink
      - name: Type Check
        # Script renamed from type-check to typecheck in upstream sync
        # (commit 607078d2c). See MERGE_GUIDE.md §10 for details.
        working-directory: ./ui-tui
        run: npm run typecheck
      - name: Run Tests
        working-directory: ./ui-tui
        run: npm test
