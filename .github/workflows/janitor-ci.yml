name: Janitor CI
on: [push, pull_request]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv pip install --system -e ".[all]"
      - name: Run Python tests
        run: uv run pytest tests/test_janitor_cli.py tests/hermes_cli/test_skin_engine.py -v

  react-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./ui-tui
        run: npm install
      - name: Build local packages (hermes-ink)
        working-directory: ./ui-tui
        run: npm run build --prefix packages/hermes-ink
      - name: Type Check
        working-directory: ./ui-tui
        run: npm run type-check
      - name: Run Tests
        working-directory: ./ui-tui
        run: npm test
