name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Janitor-specific tests only. Upstream's test suite is exercised by
    # the `upstream-sync-verify` job below, which runs on:
    #   - workflow_dispatch (manual trigger for ad-hoc verification)
    #   - push to main when the commit message indicates an upstream
    #     sync/merge (chore(sync):, fix(sync):, or merge of an
    #     upstream-sync-* branch).
    #
    # Rationale (see AGENTS.md "Fork Directive #11 — Test Pruning"):
    # Upstream's CI already validates its test suite before any commit
    # reaches the Janitor fork. Re-running the same ~17k tests in the
    # fork on every PR is redundant work that adds wall-clock cost and
    # noise. tests/janitor/ covers the fork's actual customizations: the
    # launcher, update flow, ~/.janitor layout migration, plugin, services,
    # skills, skin, Telegram branding, MCP dashboard endpoints and the
    # post-sync invariants (directives #14 and #15).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Set up locked Python and test dependencies
        # Same action as upstream's test job: PM installs the locked Python
        # and uv from pm/lock.json and builds the isolated test environment
        # (dev + test dependency groups), exported as HERMES_PYTHON.
        # scripts/run_tests.sh uses it instead of provisioning its own.
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run Janitor-specific tests
        # The Janitor gate (AGENTS.md directive #11): every test under
        # tests/janitor/ plus `python -m janitor.overlay check`, which fails
        # on any divergence from upstream not declared in janitor/overlay.yaml.
        # tests/janitor/ includes the monkeypatch-signature (directive #14)
        # and duplicate-definition (directive #15) guards. TUI and desktop
        # gates run in janitor-ci.yml.
        run: scripts/janitor-sync-verify.sh --skip-tui --skip-desktop
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  # Stub: kept for forward-compatibility. The Janitor suite (tests/janitor/)
  # is small enough that per-file duration tracking is unnecessary. When it
  # grows large, reintroduce the matrix slicing here using the same pattern
  # as upstream's prior version of this file.
  save-durations:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: No-op (Janitor test suite is too small to need slicing)
        run: echo "Janitor test suite uses 14 files; no duration merge needed."

  # Full upstream test suite, run on demand or after every sync commit.
  # See AGENTS.md "Fork Directive #11 — Test Pruning" for rationale.
  # chore(sync): / fix(sync): use startsWith to scope to the commit subject.
  # The upstream-sync-* branch check uses contains because GitHub's standard
  # merge commit ('Merge pull request #N from owner/upstream-sync-...')
  # does not start with the prefix — the branch name is in the body.
  upstream-sync-verify:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       (startsWith(github.event.head_commit.message, 'chore(sync):') ||
        startsWith(github.event.head_commit.message, 'fix(sync):') ||
        contains(github.event.head_commit.message, 'upstream-sync-')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Set up locked Python and test dependencies
        # Same action and extras as upstream's test job: tests/conftest.py
        # forbids mid-run lazy installs, so every SDK the suite exercises
        # must be in the test environment up front.
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run upstream test suite (slice ${{ matrix.slice }}/6)
        # scripts/run_tests.sh gives the same hermetic env as upstream CI.
        # tests/ci/ is left out: it asserts on upstream workflows that the
        # fork prunes on every sync (MERGE_GUIDE.md). Explicit roots bypass
        # the runner's e2e/integration/docker skip, so those are excluded
        # here too (e2e has its own job below).
        #
        # Deselected: upstream plugin-discovery tests that expect no
        # entry-point plugin in the venv. The fork's pyproject.toml installs
        # the `janitor` entry point, so they always see one extra plugin.
        # Upstream runs them in its own CI. A renamed test is no longer
        # matched and fails again here, which is the signal to update this
        # list.
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          mapfile -t roots < <(find tests -mindepth 1 -maxdepth 1 \( -type d -o -name 'test_*.py' \) \
            -not -name ci -not -name e2e -not -name integration -not -name docker \
            -not -name __pycache__ | sort)
          deselect=(
            --deselect=tests/hermes_cli/test_plugin_scanner_recursion.py::TestCategoryNamespaceRecursion::test_depth_cap_two
            --deselect=tests/hermes_cli/test_plugins_cmd_category_discovery.py::TestCmdListJson::test_json_status_uses_key
            --deselect=tests/hermes_cli/test_plugins_cmd_category_discovery.py::TestDiscoverAllPlugins::test_mixed_flat_and_category
            --deselect=tests/hermes_cli/test_plugins.py::TestPluginDiscovery::test_failed_discovery_is_not_cached
          )
          scripts/run_tests.sh --slice ${{ matrix.slice }}/6 "${roots[@]}" "${deselect[@]}"

  e2e:
    # Mirrors upstream's e2e job (one subprocess per file, in parallel, with
    # the Ink TUI built) on a standard runner instead of upstream's 32-core
    # one: the suite takes ~5 min on 4 vCPUs. tests/e2e/core/upgrade is not
    # run here — it exercises upstream's `hermes update` from upstream's N-1
    # tag, which upstream runs in its own e2e-upgrade job.
    #
    # tests/e2e/ is upstream's suite, already green in upstream's CI, so it
    # runs in the same tier as upstream-sync-verify (AGENTS.md directive
    # #11), not on every PR.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       (startsWith(github.event.head_commit.message, 'chore(sync):') ||
        startsWith(github.event.head_commit.message, 'fix(sync):') ||
        contains(github.event.head_commit.message, 'upstream-sync-')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up locked Python, Node and test dependencies
        # Same action and inputs as upstream's e2e job. toolchain: all puts
        # PM's locked Node in the PM store: the E2E sandboxes copy node from
        # there and the dashboard's /api/pty resolves the TUI's node through
        # PM only, so a setup-node binary on PATH is invisible to them.
        # `messaging`: tests/e2e/core/platforms runs the real Telegram/
        # Discord/Slack adapters against local stand-ins.
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Install Node deps and build the Ink TUI
        # tests/e2e/core/terminal drives the real `hermes --tui` over a PTY;
        # HERMES_E2E_REQUIRE_TUI=1 below turns a missing build into a failure.
        uses: ./.github/actions/retry
        with:
          command: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install tmux
        # tests/e2e/core/cli_tmux drives real CLIs in tmux; require_tmux()
        # fails (not skips) without it under HERMES_E2E_REQUIRE_TUI=1.
        run: |
          set -euo pipefail
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V

      - name: Require a WAL-capable SQLite
        # The state.db suites skip on a WAL-reset-vulnerable SQLite; fail
        # instead of reporting green over zero coverage.
        run: |
          "$HERMES_PYTHON" -c "import sqlite3, hermes_state_wal as w; print('sqlite', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

      - name: Run e2e tests
        run: |
          mapfile -t files < <(find tests/e2e -name 'test_*.py' -not -path 'tests/e2e/core/upgrade/*' | sort)
          scripts/run_tests.sh --include-integration "${files[@]}"
        env:
          # Multi-process episodes (torture chamber, compaction kill -9,
          # gateway liveness, cron soak) legitimately run past the 300 s
          # default.
          HERMES_TEST_FILE_TIMEOUT: "900"
          # Upstream runs with 0 retries on 32 cores, where its race detectors
          # are tuned. On 4 vCPUs test_resize_scrollback and
          # test_tui_gateway_model_switch_routing fail ~1 run in 3 on upstream
          # itself, so the fork allows one fresh-subprocess retry per file:
          # a fork regression still fails twice, and every pass-on-retry is
          # listed in the runner's FLAKY summary.
          HERMES_TEST_FILE_RETRIES: "1"
          HERMES_E2E_REQUIRE_TUI: "1"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""