# Dependabot del fork Janitor (touchpoint fork-github-meta en janitor/overlay.yaml).
#
# Solo github-actions: las dependencias de código van fijadas en uv.lock y
# package-lock.json y se mueven a mano, tras revisión (política de fijado de
# AGENTS.md). Las acciones van fijadas por SHA y Dependabot propone el SHA nuevo.
#
# Solo vigila .github/workflows/ (directory "/"), donde el fork conserva cuatro
# workflows; las actualizaciones de workflows de upstream que el fork poda no
# llegan aquí. Sin `labels:` propias: las etiquetas `dependencies` y
# `github-actions` no existen en el repositorio.
#
# Las actualizaciones de seguridad (solo ante un CVE) se activan aparte en
# Settings → Code security → Dependabot security updates; hoy están
# desactivadas (decisión pendiente del dueño).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      # Un PR semanal con todas las subidas menores y de parche.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
