name: "🛠️ Ayuda con la instalación"
description: La app no termina de instalar, no arranca o no conecta con el proveedor.
title: "[Instalación]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, revisa la [guía de instalación](https://github.com/reck74/Janitor-Agent/blob/main/docs/janitor/instalar-app.md).
        Si tenías una instalación antigua por terminal (`~/.janitor/janitor-core`), desinstálala primero:
        [guía](https://github.com/reck74/Janitor-Agent/blob/main/docs/janitor/desinstalar-instalacion-antigua.md).
        No pegues claves de API ni tokens.

  - type: textarea
    id: problem
    attributes:
      label: Qué intentaste y qué pasó
      description: En qué paso se detuvo la instalación y el mensaje que viste.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Linux
        - macOS
        - Windows
        - Otro
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Paquete de la app
      description: El archivo que descargaste de Releases (por ejemplo el AppImage) y su versión.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Registros (opcional)
      description: Lo que muestre la pantalla de instalación o `~/.janitor/logs/errors.log`, sin secretos.
      render: shell
