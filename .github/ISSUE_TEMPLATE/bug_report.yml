name: "🐛 Fallo"
description: Algo está roto, se cuelga o hace lo que no debe.
title: "[Fallo]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar:
        - Busca en las [incidencias abiertas](https://github.com/reck74/Janitor-Agent/issues) por si ya está.
        - Actualiza (`janitor update` o desde la app) y comprueba que el fallo sigue.
        - Quita claves, tokens y datos personales de todo lo que pegues.

  - type: textarea
    id: description
    attributes:
      label: Qué pasa
      description: Descripción clara del fallo, con el mensaje de error si lo hay.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abro la app (o ejecuto `janitor`)
        2. Escribo "..."
        3. Aparece el error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Parte afectada
      multiple: true
      options:
        - App de escritorio
        - Instalación o actualización
        - Terminal (TUI, comando `janitor`)
        - Telegram u otra mensajería
        - Skills o servicios opcionales (`janitor services`)
        - Proveedor de IA o modelos
        - Memoria
        - Otra
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Linux
        - macOS
        - Windows
        - Otro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Janitor
      description: Salida de `janitor --version` o la versión que muestra la app.
      placeholder: THE JANITOR v0.21.5+janitor.2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Registros (opcional)
      description: Las últimas líneas de `~/.janitor/logs/errors.log` o de `janitor logs --level WARNING`, sin secretos.
      render: shell
