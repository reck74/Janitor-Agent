name: "✨ Propuesta"
description: Una función nueva o una mejora de algo que ya existe.
title: "[Propuesta]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Janitor crece por skills y servicios opcionales, no engordando la base: si la idea
        cabe en una skill (`janitor/skills/`) o en un aplicativo opcional, dilo.

  - type: textarea
    id: problem
    attributes:
      label: Qué problema resuelve
      description: Lo que hoy no puedes hacer o te cuesta, con un ejemplo concreto.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Cómo lo harías
      description: El comportamiento que esperas. Si propones comandos o pantallas, descríbelos.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options:
        - Skill nueva o mejora de una skill
        - Aplicativo opcional (servicio con Docker)
        - App de escritorio
        - Terminal (TUI)
        - Mensajería
        - Otro
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que consideraste (opcional)
