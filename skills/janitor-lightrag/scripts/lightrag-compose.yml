name: janitor-lightrag
# LightRAG — Self-hosted Knowledge Graph + RAG
# Stack: 3 containers (app + PostgreSQL pgvector + isolated Ollama embeddings)
# Port: 127.0.0.1:9621 (localhost-only)
# Deploy: bash ~/.janitor/skills/janitor-lightrag/scripts/deploy.sh
#
# Generated by Janitor — DO NOT edit credentials here.
# Credentials live in ~/.janitor/docker/lightrag.env (chmod 600)

services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
    container_name: janitor-lightrag
    restart: unless-stopped
    env_file: ${HERMES_HOME:-$HOME/.janitor}/docker/lightrag.env
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - lightrag_storage:/app/data/rag_storage
      - lightrag_inputs:/app/data/inputs
      - lightrag_prompts:/app/data/prompts
    depends_on:
      lightrag-db:
        condition: service_healthy
      lightrag-embeddings:
        condition: service_healthy
    networks:
      - janitor-lightrag-network
    # host-gateway lets extra_hosts resolve to the dynamic Docker bridge gateway
    # (default bridge and user-defined bridges use different gateway ranges).
    # The actual IP is detected at container start by Docker — do not hardcode it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  lightrag-db:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    container_name: janitor-lightrag-db
    restart: unless-stopped
    env_file: ${HERMES_HOME:-$HOME/.janitor}/docker/lightrag.env
    environment:
      POSTGRES_DB: lightrag
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lightrag_pg:/var/lib/postgresql
    networks:
      - janitor-lightrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightrag -d lightrag"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  lightrag-embeddings:
    image: ollama/ollama:latest@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    container_name: janitor-lightrag-embeddings
    restart: unless-stopped
    volumes:
      - lightrag_embeddings:/root/.ollama
    networks:
      - janitor-lightrag-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

volumes:
  lightrag_storage:
    name: janitor-lightrag-storage
  lightrag_inputs:
    name: janitor-lightrag-inputs
  lightrag_prompts:
    name: janitor-lightrag-prompts
  lightrag_pg:
    name: janitor-lightrag-pg
  lightrag_embeddings:
    name: janitor-lightrag-embeddings

networks:
  janitor-lightrag-network:
    name: janitor-lightrag-network
    driver: bridge
