name: janitor-honcho
services:
  janitor-honcho-api:
    image: janitor-honcho:e2d2aba18286
    build:
      context: ${JANITOR_HONCHO_SOURCE:?Run scripts/setup-honcho.sh}
    container_name: janitor-honcho-api
    entrypoint: [sh, docker/entrypoint.sh]
    ports: ["127.0.0.1:1973:8000"]
    env_file: ["${JANITOR_HONCHO_ENV:?Missing honcho.env}"]
    volumes: ["${JANITOR_HONCHO_CONFIG:?Missing honcho.toml}:/app/config.toml:ro", "janitor-honcho-api-data:/data"]
    networks: [janitor-honcho-network]
    depends_on:
      janitor-honcho-database: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
  janitor-honcho-deriver:
    image: janitor-honcho:e2d2aba18286
    container_name: janitor-honcho-deriver
    entrypoint: [python, -m, src.deriver]
    env_file: ["${JANITOR_HONCHO_ENV:?Missing honcho.env}"]
    volumes: ["${JANITOR_HONCHO_CONFIG:?Missing honcho.toml}:/app/config.toml:ro"]
    networks: [janitor-honcho-network]
    depends_on:
      janitor-honcho-api: {condition: service_healthy}
    restart: unless-stopped
  janitor-honcho-database:
    image: pgvector/pgvector:0.8.1-pg15@sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
    container_name: janitor-honcho-database
    environment:
      POSTGRES_USER: ${HONCHO_POSTGRES_USER:?Missing database user}
      POSTGRES_PASSWORD: ${HONCHO_POSTGRES_PASSWORD:?Missing database password}
      POSTGRES_DB: honcho
    volumes: [janitor-honcho-pgdata:/var/lib/postgresql/data]
    networks: [janitor-honcho-network]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  janitor-honcho-redis:
    image: redis:8.2@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    container_name: janitor-honcho-redis
    networks: [janitor-honcho-network]
    volumes: [janitor-honcho-redis-data:/data]
    restart: unless-stopped
volumes:
  janitor-honcho-pgdata: {name: janitor-honcho-pgdata}
  janitor-honcho-api-data: {name: janitor-honcho-api-data}
  janitor-honcho-redis-data: {name: janitor-honcho-redis-data}
networks:
  janitor-honcho-network: {name: janitor-honcho-network}
