name: janitor-firecrawl
# Janitor — Firecrawl self-host stack
#
# Requires env_file at ${HERMES_HOME:-$HOME/.janitor}/docker/firecrawl.env generated by
# deploy.sh. That file carries every secret/password so this compose stays
# secret-free and committable. Services load it via env_file; the environment:
# block below only carries fixed service-to-service URLs and tuning constants.
#
# Hard constraint: POSTGRES_DB MUST be "postgres". The ghcr.io/firecrawl/nuq-postgres
# image hardcodes cron.database_name=postgres and refuses pg_cron otherwise.
# See .plans/firecrawl-deploy-fix.md BUG 4.

services:
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest@sha256:b220e83d09fca4810356a001aafb7d2af4eefd7c6407467ff4c92fc9f45ff0dd
    container_name: janitor-firecrawl-api
    ports:
      - "127.0.0.1:1974:3002"
    env_file:
      - ${HERMES_HOME:-$HOME/.janitor}/docker/firecrawl.env
    environment:
      # Fixed service-to-service URLs (no secrets here)
      - REDIS_URL=redis://firecrawl-redis:6379
      - REDIS_RATE_LIMIT_URL=redis://firecrawl-redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000/scrape
      - POSTGRES_HOST=firecrawl-postgres
      - POSTGRES_PORT=5432
      - HOST=0.0.0.0
      - PORT=3002
      - MAX_CONCURRENT_JOBS=2
      - BROWSER_POOL_SIZE=2
      - MAX_CPU=0.8
      - MAX_RAM=0.8
      # NUQ_RABBITMQ_URL, TEST_API_KEY, BULL_AUTH_KEY, POSTGRES_USER/PASSWORD/DB,
      # USE_DB_AUTHENTICATION, NUM_WORKERS_PER_QUEUE, CRAWL_CONCURRENT_REQUESTS
      # all come from env_file above.
    command: ["node", "dist/src/harness.js", "--start-docker"]
    restart: unless-stopped
    networks:
      - firecrawl-network
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
    cpus: 2.0
    mem_limit: 4G
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3002/v0/health/liveness', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest@sha256:717699bf8a61d94451926c810d19ca1d36278192907e307bf5229a558b08fcc6
    container_name: janitor-firecrawl-playwright
    environment:
      - PORT=3000
      - MAX_CONCURRENT_PAGES=10
    restart: unless-stopped
    networks:
      - firecrawl-network

  firecrawl-redis:
    image: redis:alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: janitor-firecrawl-redis
    restart: unless-stopped
    networks:
      - firecrawl-network
    volumes:
      - firecrawl-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  firecrawl-rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: janitor-firecrawl-rabbitmq
    # RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS come from env_file.
    # They MUST match the credentials embedded in firecrawl-api's NUQ_RABBITMQ_URL
    # (deploy.sh writes both with the same value).
    env_file:
      - ${HERMES_HOME:-$HOME/.janitor}/docker/firecrawl.env
    restart: unless-stopped
    networks:
      - firecrawl-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest@sha256:9b638af78d99873bc0ba2b57c9cbcd01df6ce96efeaa72d36cfbe0f76521e8fc
    container_name: janitor-firecrawl-postgres
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB come from env_file.
    # POSTGRES_DB MUST be "postgres" (see header note).
    env_file:
      - ${HERMES_HOME:-$HOME/.janitor}/docker/firecrawl.env
    volumes:
      - firecrawl-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - firecrawl-network
    healthcheck:
      # Hardcoded user/db — nuq-postgres image forces cron.database_name=postgres,
      # so we always probe with -U postgres -d postgres regardless of env vars
      # (which Docker doesn't expand inside healthcheck CMD-SHELL anyway).
      test:
        - CMD-SHELL
        - "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -tAc \"SELECT 1 FROM pg_extension WHERE extname='pg_cron'\" | grep -q 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    cpus: 1.0
    mem_limit: 1G

volumes:
  firecrawl-redis-data:
    name: janitor-firecrawl-redis-data
  firecrawl-pgdata:
    name: janitor-firecrawl-pgdata

networks:
  firecrawl-network:
    name: janitor-firecrawl-network
