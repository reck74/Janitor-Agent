# LightRAG — Self-hosted Knowledge Graph + RAG
# Stack: 2 containers (lightrag app + postgres with pgvector)
# Port: 127.0.0.1:9621 (localhost-only)
# Deploy: bash ~/.janitor/skills/devops/janitor-lightrag/scripts/deploy.sh
#
# Generated by Janitor — DO NOT edit credentials here.
# Credentials live in ~/.janitor/docker/lightrag.env (chmod 600)

services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: janitor-lightrag
    restart: unless-stopped
    env_file: ${HERMES_HOME:-$HOME/.janitor}/docker/lightrag.env
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - lightrag_storage:/app/data/rag_storage
      - lightrag_inputs:/app/data/inputs
      - lightrag_prompts:/app/data/prompts
    depends_on:
      lightrag-db:
        condition: service_healthy
    networks:
      - janitor-lightrag-network
      - janitor-honcho-network
    # host-gateway lets extra_hosts resolve to the dynamic Docker bridge gateway
    # (default bridge and user-defined bridges use different gateway ranges).
    # The actual IP is detected at container start by Docker — do not hardcode it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9621/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  lightrag-db:
    image: pgvector/pgvector:pg18
    container_name: janitor-lightrag-db
    restart: unless-stopped
    env_file: ${HERMES_HOME:-$HOME/.janitor}/docker/lightrag.env
    environment:
      POSTGRES_DB: lightrag
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lightrag_pg:/var/lib/postgresql
    networks:
      - janitor-lightrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightrag -d lightrag"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  lightrag_storage:
  lightrag_inputs:
  lightrag_prompts:
  lightrag_pg:

networks:
  janitor-lightrag-network:
    driver: bridge
  # External dependency: janitor-honcho must be deployed FIRST so this network
  # exists. Cross-network access reaches janitor-honcho-ollama:11434 for
  # embeddings (host.docker.internal is unreachable on hosts with docker0
  # bridge in NO-CARRIER state — see SKILL.md pitfall #4).
  janitor-honcho-network:
    external: true
