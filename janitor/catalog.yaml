# Janitor skill catalog (directive #19).
#
# The catalog decides which skills a Janitor agent (a Hermes profile) can see.
# A profile lists catalog ids in `janitor.skills` of its config.yaml and
# `janitor.catalog.apply(home)` turns that list into one absolute
# `skills.external_dirs` entry per skill. A skill upstream adds is never
# active just because it exists: it has to be listed here AND chosen.
#
# Fields per skill:
#   id         the skill's frontmatter `name:` (checked by `python -m janitor.catalog check`)
#   source     janitor          -> path relative to janitor/skills/
#              upstream-bundled -> path relative to the install tree's skills/
#              upstream-optional-> path relative to the install tree's optional-skills/
#              hub              -> installed per home from the skills hub (no path)
#   purpose    a key of `purposes`
#   platforms  optional OS gate: linux | macos | windows (absent = every OS)
#   templates  keys of `templates` that include the skill; [] = optional,
#              the user ticks it.

schema: 1

purposes:
  sistema: "Equipo y sistema"
  documentos: "Documentos y oficina"
  investigacion: "Investigación"
  proyectos: "Proyectos"
  opcional: "Opcionales"
  aplicativos: "Aplicativos opcionales"

templates:
  main: "Janitor"
  investigador: "Investigador"
  creador-proyectos: "Creador de proyectos"

skills:
  # --- Equipo y sistema -------------------------------------------------
  - id: janitor-onboarding
    source: janitor
    path: core/janitor-onboarding
    purpose: sistema
    platforms: [linux, macos, windows]
    templates: [main]

  - id: janitor-system-health
    source: janitor
    path: system/janitor-system-health
    purpose: sistema
    platforms: [linux]
    templates: [main]

  - id: janitor-maintenance
    source: janitor
    path: system/janitor-maintenance
    purpose: sistema
    platforms: [linux]
    templates: [main]

  - id: janitor-cleanup
    source: janitor
    path: system/janitor-cleanup
    purpose: sistema
    platforms: [linux]
    templates: [main]

  - id: janitor-file-organizer
    source: janitor
    path: system/janitor-file-organizer
    purpose: sistema
    platforms: [linux]
    templates: [main]

  # --- Documentos y oficina --------------------------------------------
