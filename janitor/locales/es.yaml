      billing:
        title: "El proveedor del modelo indica que no queda saldo"
        hint: "Recarga la cuenta o cambia de modelo con /model."
      endpoint:
        title: "Tu endpoint de modelo personalizado no respondió"
        hint: "Comprueba que el endpoint está en marcha y luego usa /retry."
      streaming:
