# Janitor overlay inventory.
#
# Every way this fork differs from upstream Hermes is declared here. Anything
# not matched by `fork_paths` or by a touchpoint's `files` is an undeclared
# divergence: `python -m janitor.overlay check` (run by
# scripts/janitor-sync-verify.sh after each `chore(sync)`) fails on it, so a
# merge can no longer silently keep stale upstream code alive.
#
# Touchpoint fields:
#   files   — paths (globs allowed) edited in place on top of upstream.
#   why     — what the edit does.
#   verify  — `test:<id>` is a behavioral check in
#             tests/janitor/test_janitor_overlay_contract.py (the test fails
#             when an id has no check or a check has no id); `ci:<job>` means
#             a CI job exercises it.
#   merge   — how a `chore(sync)` conflict on these files is resolved:
#             `ours` keep the fork version, `reapply` take upstream then
#             re-apply the edit described in `why`.
#   upstream_candidate — true when the edit is a generic fix/hook worth
#             proposing upstream (see docs/janitor/upstream-candidates.md).

schema: 1

upstream:
  repo: https://github.com/NousResearch/hermes-agent.git
  # Hermes v2026.9.24 — upstream parent of the last chore(sync) merge.
  base: f97608f178d1ffeca59860195ab7da295f7c8e5f

fork_paths:
  - janitor/**
  - assets/janitor/**
  - tests/janitor/**
  - apps/desktop-janitor/**
  - docs/janitor/**
  - scripts/*janitor*
  - scripts/setup-honcho.sh
  - scripts/verify-firecrawl-pgcron.sh
  # Pre-1.0 import aliases kept for old console scripts.
  - janitor_cli.py
  - janitor_update_core.py
  - janitor_update_bootstrap.py
  - janitor_version.py
  - janitor_ext/**
  - janitor-tui.png
  # Fork automation.
  - .github/workflows/janitor-ci.yml
  - .github/workflows/janitor-desktop-release.yml
  - .github/workflows/upstream-sync.yml
  - .claude/**
  - .opencode/**

touchpoints:
  - id: version
    files: [pyproject.toml, hermes_cli/__init__.py, uv.lock]
    why: Version carries the `+janitor.N` local segment.
    verify: test:version
    merge: reapply

  - id: packaging
    files: [pyproject.toml, uv.lock]
    why: >-
      `janitor` console script, `hermes_agent.plugins` entry point for the
      Janitor plugin, `janitor` package + data, pre-1.0 alias py-modules.
    verify: test:packaging
    merge: reapply

  - id: banner
    files:
      - hermes_cli/banner.py
      - hermes_cli/cli_render.py
      - hermes_cli/_startup_fast.py
      - tests/hermes_cli/test_startup_fast_guards.py
    why: >-
      Version label reads `THE JANITOR v<display_version>`; upstream tests
      asserting the label follow AGENTS.md directive #12.
    verify: test:banner
    merge: reapply
    upstream_candidate: true

  - id: mcp-dashboard-endpoints
    files:
      - hermes_cli/mcp_config.py
      - hermes_cli/web_routers/mcp.py
    why: >-
      `POST /api/mcp/servers/{name}/discover` (tools with inputSchema) and
      `GET /api/mcp/servers/{name}/logs` (per-server stderr slice).
    verify: test:mcp-dashboard-endpoints
    merge: reapply
    upstream_candidate: true

  - id: backend-user-copy
    files: [tui_gateway/user_messages.py]
    why: >-
      The session/turn error copy the TUI, desktop and dashboard print
      (`turn_error_text`, `agent_init_failed_message`) is looked up under
      `tui_gateway.*` in the i18n catalog before falling back to the English
      text, and the missing-credentials detail is matched to a catalog
      sentence. Upstream catalogs lack those keys, so upstream output is
      unchanged; Janitor's overlay (janitor/locales/es.yaml, merged and
      exported as HERMES_BUNDLED_LOCALES by the launcher) supplies Spanish
      "Janitor" copy. One `# JANITOR:` block plus the call sites using it.
    verify: test:backend-user-copy
    merge: reapply
    upstream_candidate: true

  - id: update-single-flight
    files:
      - gateway/slash_commands.py
    why: >-
      The messaging /update handler rewrote .update_pending.json and removed
      .update_exit_code before spawning, so a second /update (or one sent
      while the app or a terminal held the update lock) made the first
      update's watcher announce a failure with the real update still running.
      `_update_already_running` answers "already running" before any marker
      is touched: the shared lock is held, or a pending marker younger than
      the watcher's 30-minute ceiling has no exit code yet. The defect is
      upstream's. Every changed line carries `# JANITOR:`.
    verify: test:update-single-flight
    merge: reapply
    upstream_candidate: true

  - id: runtime-copy
    files:
      - agent/i18n.py
      - gateway/run_turn.py
      - gateway/run_notifications.py
      - hermes_cli/commands.py
      - hermes_cli/commands_platforms.py
      - hermes_cli/web_server_messaging.py
    why: >-
      English literals the engine sends to a user with no key in upstream's
      en.yaml ask the i18n catalog first: `agent.i18n.t_default(key,
      english)` returns the catalog text, else the inline English, so
      upstream catalogs give upstream output byte for byte. Call sites: the
      one-time "no home channel" notice (run_turn), the /update watcher and
      post-update/restart notices (run_notifications), command descriptions
      in gateway /help, /commands and the Telegram command menu
      (`commands.localized_description`), and the Telegram QR pairing errors
      (web_server_messaging; expired/claimed stay English because the app
      matches those words in the 410 body). Keys live under `runtime_copy.*`
      in janitor/locales/es.yaml. Every changed line carries `# JANITOR:`.
    verify: test:runtime-copy
    merge: reapply
    upstream_candidate: true

  - id: web-typecheck
    files: [web/package.json]
    why: "`tsc -b --noEmit`; upstream's `tsc -p .` checks no files (tsconfig has `files: []`)."
    verify: ci:janitor-ci
    merge: reapply
    upstream_candidate: true

  - id: tui-branding-hook
    files:
      - ui-tui/src/theme.ts
      - ui-tui/src/components/branding.tsx
      - ui-tui/src/__tests__/brandingSkinTagline.test.ts
    why: >-
      Skin keys `branding.tagline` / `branding.vendor` replace the hardcoded
      Nous Research tagline and vendor label. The Janitor look itself is the
      `sentry-janitor` skin (assets/janitor/sentry-janitor.yaml).
    verify: ci:janitor-ci
    merge: reapply
    upstream_candidate: true

  - id: tui-test-timeout
    files: [ui-tui/vitest.config.ts]
    why: 15s vitest timeout; cursorDriftRegression.test.ts flakes at the 5s default on CI runners.
    verify: ci:janitor-ci
    merge: reapply
    upstream_candidate: true

  - id: installers
    files: [scripts/bootstrap.sh, scripts/install.ps1]
    why: Install from the Janitor fork into ~/.janitor and check Docker/Honcho (directive #8).
    verify: ci:janitor-ci
    merge: ours

  - id: install-sh
    files: [scripts/install.sh]
    why: >-
      The desktop app's installer installs the fork: clones reck74/Janitor-Agent
      into ~/.janitor by default, links `janitor` (never the hermes /
      hermes-agent / hermes-acp launchers) via `python -m janitor.seed
      --link-command`, defaults to --no-skills, and runs `python -m
      janitor.seed --home` in the config stage before any skills sync. A
      home that already holds the legacy terminal install (`janitor-core/`)
      is refused in every --stage, in --ensure and in the monolithic run before anything
      is written, with a Spanish message (and the {ok:false} JSON frame's
      reason) telling the user to keep using `janitor` from the terminal
      until adoption exists (plan F1-22 / F5-01). Every changed hunk carries
      a `# JANITOR:` comment.
    verify: test:install-sh
    merge: reapply

  - id: desktop-update-posix
    files: [scripts/desktop-update/posix.sh]
    why: >-
      The desktop app's POSIX update hand-off runs `venv/bin/janitor update`
      (or `python -m janitor.cli update` on the bricked-alias fallback)
      instead of `hermes update` whenever the checkout's venv has the
      `janitor` script, so app-driven updates go through
      janitor/update_core.py (directive #13). One `# JANITOR:` block right
      after the update invoke is chosen. The Linux relaunch gate's two
      messages (`skew`: app package not updated — every AppImage update;
      `manual`: rebuilt app cannot relaunch) are Spanish, because the app
      shows the result `message` verbatim (main.ts boot dialog `detail`,
      ui.html shim, notify-send); each line carries `# JANITOR:`.
    verify: test:desktop-update-posix
    merge: reapply

  - id: fork-docs
    files: [AGENTS.md, README.md, CHANGELOG.md, MERGE_GUIDE.md, .env.example, .gitignore]
    why: Fork directives, docs and ignore rules.
    verify: ci:janitor-ci
    merge: ours

  - id: fork-ci
    files: [.github/workflows/*.y*ml]
    why: >-
      Two-tier CI (directive #11): the PR gate runs the Janitor suite, the
      full upstream suite runs on sync. Upstream workflows are adjusted for
      the fork's runners and secrets.
    verify: ci:janitor-ci
    merge: ours
