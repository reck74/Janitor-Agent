# Janitor overlay inventory.
#
# Every way this fork differs from upstream Hermes is declared here. Anything
# not matched by `fork_paths` or by a touchpoint's `files` is an undeclared
# divergence: `python -m janitor.overlay check` (run by
# scripts/janitor-sync-verify.sh after each `chore(sync)`) fails on it, so a
# merge can no longer silently keep stale upstream code alive.
#
# Touchpoint fields:
#   files   — paths (globs allowed) edited in place on top of upstream.
#   why     — what the edit does.
#   verify  — `test:<id>` is a behavioral check in
#             tests/janitor/test_janitor_overlay_contract.py (the test fails
#             when an id has no check or a check has no id); `ci:<job>` means
#             a CI job exercises it.
#   merge   — how a `chore(sync)` conflict on these files is resolved:
#             `ours` keep the fork version, `reapply` take upstream then
#             re-apply the edit described in `why`.
#   upstream_candidate — true when the edit is a generic fix/hook worth
#             proposing upstream (see docs/janitor/upstream-candidates.md).

schema: 1

upstream:
  repo: https://github.com/NousResearch/hermes-agent.git
  # Hermes v2026.9.24 — upstream parent of the last chore(sync) merge.
  base: f97608f178d1ffeca59860195ab7da295f7c8e5f

fork_paths:
  - janitor/**
  - assets/janitor/**
  - tests/janitor/**
  - apps/desktop-janitor/**
  - docs/janitor/**
  - scripts/*janitor*
  - scripts/verify-firecrawl-pgcron.sh
  # Root name the banner touchpoints import janitor.version by.
  - janitor_version.py
  - janitor-tui.png
  # Fork automation.
  - .github/workflows/janitor-ci.yml
  - .github/workflows/janitor-desktop-release.yml
  - .github/workflows/upstream-sync.yml

touchpoints:
  - id: version
    files: [pyproject.toml, hermes_cli/__init__.py, uv.lock]
    why: Version carries the `+janitor.N` local segment.
    verify: test:version
    merge: reapply

  - id: packaging
    files: [pyproject.toml, uv.lock]
    why: >-
      `janitor` console script, `hermes_agent.plugins` entry point for the
      Janitor plugin, `janitor` package + data.
    verify: test:packaging
    merge: reapply

  - id: banner
    files:
      - hermes_cli/banner.py
      - hermes_cli/cli_render.py
      - hermes_cli/_startup_fast.py
      - tests/hermes_cli/test_startup_fast_guards.py
    why: >-
      Version label reads `THE JANITOR v<display_version>`; upstream tests
      asserting the label follow AGENTS.md directive #12.
    verify: test:banner
    merge: reapply
    upstream_candidate: true

  - id: update-channel
    files: [hermes_cli/banner.py]
    why: >-
      The passive update probe of a local checkout (`_check_via_local_git`,
      `_compute_git_banner_state`) compares against the module constant
      `_UPDATE_BRANCH` instead of a fixed `main`. Upstream's value stays
      `"main"`, so upstream behaviour is unchanged; Janitor's launcher and
      plugin set it to the release channel (`janitor/release_channel.py`,
      branch `stable`) so the banner and the TUI badge announce tagged
      releases only. The nix embedded-revision path (`_upstream_main_sha`,
      `_check_via_rev`) is untouched. Every changed line carries `# JANITOR:`.
    verify: test:update-channel
    merge: reapply
    upstream_candidate: true

  - id: mcp-dashboard-endpoints
    files:
      - hermes_cli/mcp_config.py
      - hermes_cli/web_routers/mcp.py
    why: >-
      `POST /api/mcp/servers/{name}/discover` (tools with inputSchema) and
      `GET /api/mcp/servers/{name}/logs` (per-server stderr slice).
    verify: test:mcp-dashboard-endpoints
    merge: reapply
    upstream_candidate: true

  - id: backend-user-copy
    files: [tui_gateway/user_messages.py]
    why: >-
      The session/turn error copy the TUI, desktop and dashboard print
      (`turn_error_text`, `agent_init_failed_message`) is looked up under
      `tui_gateway.*` in the i18n catalog before falling back to the English
      text, and the missing-credentials detail is matched to a catalog
      sentence. Upstream catalogs lack those keys, so upstream output is
      unchanged; Janitor's overlay (janitor/locales/es.yaml, merged and
      exported as HERMES_BUNDLED_LOCALES by the launcher) supplies Spanish
      "Janitor" copy. One `# JANITOR:` block plus the call sites using it.
    verify: test:backend-user-copy
    merge: reapply
    upstream_candidate: true

  - id: update-single-flight
    files:
      - gateway/slash_commands.py
    why: >-
      The messaging /update handler rewrote .update_pending.json and removed
      .update_exit_code before spawning, so a second /update (or one sent
      while the app or a terminal held the update lock) made the first
      update's watcher announce a failure with the real update still running.
      `_update_already_running` answers "already running" before any marker
      is touched: the shared lock is held, or a pending/claimed marker
      younger than the watcher's 30-minute ceiling still exists (its watcher
      has not delivered the result yet). The defect is
      upstream's. Every changed line carries `# JANITOR:`.
    verify: test:update-single-flight
    merge: reapply
    upstream_candidate: true

  - id: runtime-copy
    files:
      - agent/i18n.py
      - gateway/run_turn.py
      - gateway/run_notifications.py
      - hermes_cli/commands.py
      - hermes_cli/commands_platforms.py
      - hermes_cli/web_server_messaging.py
      - hermes_cli/_startup_fast.py
    why: >-
      English literals the engine sends to a user with no key in upstream's
      en.yaml ask the i18n catalog first: `agent.i18n.t_default(key,
      english)` returns the catalog text, else the inline English, so
      upstream catalogs give upstream output byte for byte. Call sites: the
      one-time "no home channel" notice (run_turn), the /update watcher and
      post-update/restart notices (run_notifications), command descriptions
      in gateway /help, /commands and the Telegram command menu
      (`commands.localized_description`), and the Telegram QR pairing errors
      (web_server_messaging; expired/claimed stay English because the app
      matches those words in the 410 body), and the `--version` lines after the
      banner (_startup_fast, also in touchpoint banner). Keys live under `runtime_copy.*`
      in janitor/locales/es.yaml. Every changed line carries `# JANITOR:`.
    verify: test:runtime-copy
    merge: reapply
    upstream_candidate: true

  - id: web-typecheck
    files: [web/package.json]
    why: "`tsc -b --noEmit`; upstream's `tsc -p .` checks no files (tsconfig has `files: []`)."
    verify: ci:janitor-ci
    merge: reapply
    upstream_candidate: true

  - id: tui-branding-hook
    files:
      - ui-tui/src/theme.ts
      - ui-tui/src/components/branding.tsx
      - ui-tui/src/__tests__/brandingSkinTagline.test.ts
    why: >-
      Skin keys `branding.tagline` / `branding.vendor` replace the hardcoded
      Nous Research tagline and vendor label. The Janitor look itself is the
      `sentry-janitor` skin (assets/janitor/sentry-janitor.yaml).
    verify: ci:janitor-ci
    merge: reapply
    upstream_candidate: true

  - id: tui-test-timeout
    files: [ui-tui/vitest.config.ts]
    why: 15s vitest timeout; cursorDriftRegression.test.ts flakes at the 5s default on CI runners.
    verify: ci:janitor-ci
    merge: reapply
    upstream_candidate: true

  - id: install-ps1
    files: [scripts/install.ps1]
    why: >-
      The Windows twin of install-sh (F6-05): the desktop app downloads it and
      runs it stage by stage with Windows PowerShell 5.1. It clones
      reck74/Janitor-Agent (git and ZIP fallback) into %USERPROFILE%\.janitor by
      default (the same ~/.janitor on every platform), defaults -Branch to the
      release channel (`stable`, janitor/release_channel.py), installs the
      browser (Playwright Chromium, Browser Use CLI) only with -WithBrowser and
      Computer Use only with -WithComputerUse, stages only the `janitor`
      launcher (requires venv\Scripts\janitor.exe; never hermes / hermes-acp),
      and in the config-templates stage runs `python -m janitor.seed --home`
      and writes .no-bundled-skills instead of syncing upstream's bundled
      skills. HERMES_HOME is never persisted as a user variable (it would
      hijack, or be hijacked by, a real Hermes install). PortableGit still lands
      in <home>\git and is published through HERMES_GIT_BASH_PATH, as upstream.
      A home holding the legacy terminal install (`janitor-core/`) is refused
      in every -Stage, in -Ensure / -PostInstall and in the full run before
      anything is written, with the Spanish reason in the {ok:false} JSON frame
      the app reads. New visible text is Spanish; the file stays pure ASCII
      (accents as \uXXXX through Get-JanitorText). Upstream's dead second
      autostash-restore block (old `installers` touchpoint) is gone. Every
      changed hunk carries a `# JANITOR:` comment. Review fixes: a seed that
      cannot run (no venv python, janitor.seed exit != 0) fails the
      config-templates stage; an existing checkout whose origin is not the fork
      is refused before any stash/fetch/reset; recreating the venv stops only
      processes running from THAT venv and only gateway tasks whose action
      points into this home (no system-wide `taskkill /IM hermes.exe`); the
      repository/path stage titles are Spanish; -IncludeDesktop is refused.
    verify: test:install-ps1
    merge: reapply

  - id: install-sh
    files: [scripts/install.sh]
    why: >-
      The desktop app's installer installs the fork: clones reck74/Janitor-Agent
      into ~/.janitor by default, links `janitor` (never the hermes /
      hermes-agent / hermes-acp launchers) via `python -m janitor.seed
      --link-command`, defaults to --no-skills, and runs `python -m
      janitor.seed --home` in the config stage before any skills sync. A
      home that already holds the legacy terminal install (`janitor-core/`)
      is refused in every --stage, in --ensure and in the monolithic run before anything
      is written, with a Spanish message (and the {ok:false} JSON frame's
      reason) telling the user to uninstall the old one first: the app is a clean
      start and adopts nothing (plan decision 2.9, F1-22). cua-driver (Computer
      Use) is opt-in (`--with-computer-use`): it writes outside the home and seeds
      a telemetry id (F1-26). The browser (Playwright Chromium, Browser Use CLI)
      is opt-in too (`--with-browser`): the base ships none and the engine
      downloads it on first use (plan decision 2.10, F1-29). The default branch
      is the release channel (`stable`, `janitor/release_channel.py`): without
      `--branch` it installs the latest tagged version, never `main` (F1-28). One fork block after `print_success` redefines the
      banner, the final summary and the log helpers so what the app shows reads in
      Spanish with `janitor` commands (a message the table does not list prints
      upstream's English); a failed stage's JSON reason is Spanish. Every changed
      hunk carries a `# JANITOR:` comment.
    verify: test:install-sh
    merge: reapply

  - id: desktop-update-posix
    files: [scripts/desktop-update/posix.sh, scripts/desktop-update/repro.sh]
    why: >-
      The desktop app's POSIX update hand-off runs `venv/bin/janitor update`
      (or `python -m janitor.cli update` on the bricked-alias fallback)
      instead of `hermes update` whenever the checkout's venv has the
      `janitor` script, so app-driven updates go through
      janitor/update_core.py (directive #13). One `# JANITOR:` block right
      after the update invoke is chosen. When the running binary is not the
      checkout's rebuilt one and `$APPIMAGE` (AppImage runtime, inherited
      from the app's env) is an absolute path to an executable regular file,
      the gate relaunches that AppImage instead of ending in `skew`, with a
      neutral note: the app decides app/engine compatibility at boot
      (design actualizacion-diseno.md 3.3). Without `$APPIMAGE` (deb/rpm)
      `skew` stays. Every Linux-visible text — result messages (main.ts boot
      dialog `detail`, ui.html shim, notify-send/zenity/kdialog), stage names
      and the notification title — is Spanish, plus a message of its own for
      exit 2 (another update holds the lock); macOS-only bundle-swap copy and
      log lines stay upstream's. repro.sh's launch matrix matches the Spanish
      messages. Each line carries `# JANITOR:`.
    verify: test:desktop-update-posix
    merge: reapply

  - id: desktop-update-windows
    files: [scripts/desktop-update/windows.ps1]
    why: >-
      The desktop app's Windows update hand-off (F6-06). When the checkout's
      venv has janitor.exe it runs `python.exe -m janitor.cli update --yes
      [--gateway] --branch <b> --keep-stash` (janitor/update_core.py,
      directive 13) instead of upstream's `hermes_cli.main update ... --force`
      (the strict Janitor parser exits 2 on an unknown flag), waits for
      janitor.exe instead of hermes.exe to unlock, skips the apps/desktop
      build verification (the Janitor app is installed from its release, not
      built in the checkout) and restarts gateways with `-m janitor.cli
      gateway start --all`. Upstream's lines stay in place, overridden right
      after (`if ($janitorCheckout)`). Result messages, stage names and the
      WinForms card are Spanish, with a message of its own for exit 2
      (another update holds the lock). New text is ASCII (Get-JanitorText).
      Each changed line carries `# JANITOR:`. A Janitor checkout is recognised
      by janitor\cli.py (not by its launcher), so upstream's updater never runs
      on one; without -Branch no --branch is passed (the engine follows its
      channel); -NoGateway adds --no-gateway-restart.
    verify: test:desktop-update-windows
    merge: reapply

  - id: desktop-update-ui
    files: [scripts/desktop-update/ui.html]
    why: >-
      The shim window shown while the app updates (served by serve-ui.py) is
      in Spanish and names Janitor: `lang`, title, default heading/line,
      elapsed clock, the done/manual/error/disconnected states. `done` shows
      the orchestrator's note when there is one (AppImage relaunch) and
      `error` shows the orchestrator's reason instead of a fixed hint. Each
      changed line carries a `JANITOR` comment (HTML or JS).
    verify: test:desktop-update-ui
    merge: reapply

  - id: fork-docs
    files: [AGENTS.md, README.md, README.es.md, CHANGELOG.md, MERGE_GUIDE.md, .gitignore]
    why: >-
      Fork directives, docs and ignore rules. README.es.md only points to
      README.md, which is already in Spanish: upstream's Spanish README tells
      the reader to install Hermes into ~/.hermes.
    verify: ci:janitor-ci
    merge: ours

  - id: fork-ci
    files: [.github/workflows/*.y*ml]
    why: >-
      Two-tier CI (directive #11): the PR gate runs the Janitor suite, the
      full upstream suite runs on sync. Upstream workflows are adjusted for
      the fork's runners and secrets.
    verify: ci:janitor-ci
    merge: ours

  - id: fork-github-meta
    files:
      - .github/ISSUE_TEMPLATE/*.yml
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/dependabot.yml
    why: >-
      Issue and PR templates in Spanish that point to this fork, its install
      guides and the Janitor checks (directives #17/#18), not to upstream's
      Discord, README or `hermes` commands. Dependabot drops labels the repo
      does not have. upstream-sync.yml resolves a sync conflict here with the
      fork's side.
    verify: ci:janitor-ci
    merge: ours
