# janitor-lightrag — LightRAG self-hosted (base de conocimiento), skill janitor-lightrag.
# Copied by `lightrag_setup.py deploy` to <janitor root>/docker/ and run as compose project
# janitor-lightrag with `--env-file lightrag.env`. Each container gets only the variables
# listed below: no env_file, so nothing else from any .env reaches it.
# Two containers (LightRAG + Postgres with pgvector). Loopback only. No dependency on
# any other Janitor service. Janitor never removes the janitor-lightrag-* volumes.
services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: janitor-lightrag
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JANITOR_LIGHTRAG_PORT:-9621}:9621"
    environment:
      HOST: 0.0.0.0
      PORT: "9621"
      # Graph in NetworkX (JSON in the storage volume): the pgvector image has no Apache AGE.
      LIGHTRAG_GRAPH_STORAGE: NetworkXStorage
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      POSTGRES_HOST: lightrag-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: ${LIGHTRAG_DB_PASSWORD}
      POSTGRES_DATABASE: lightrag
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${LLM_BINDING_HOST}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      EMBEDDING_BINDING_API_KEY: ${EMBEDDING_BINDING_API_KEY}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      AUTH_ACCOUNTS: ${AUTH_ACCOUNTS}
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET}
      WHITELIST_PATHS: /health
      SUMMARY_LANGUAGE: Spanish
    volumes:
      - lightrag-storage:/app/data/rag_storage
      - lightrag-inputs:/app/data/inputs
    depends_on:
      lightrag-db:
        condition: service_healthy
    networks:
      - lightrag-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9621/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  lightrag-db:
    image: pgvector/pgvector:pg18
    container_name: janitor-lightrag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightrag
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: ${LIGHTRAG_DB_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql (not .../data).
      - lightrag-pgdata:/var/lib/postgresql
    networks:
      - lightrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightrag -d lightrag"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  lightrag-storage:
    name: janitor-lightrag-storage
  lightrag-inputs:
    name: janitor-lightrag-inputs
  lightrag-pgdata:
    name: janitor-lightrag-pgdata

networks:
  lightrag-network:
    name: janitor-lightrag-network
