# janitor-n8n — n8n self-hosted (automatizaciones), skill janitor-n8n.
# Copied by `n8n_setup.py deploy` to <janitor root>/docker/ and run as compose project
# janitor-n8n with `--env-file n8n.env`. The container gets only the variables listed
# below: no env_file, so nothing else from any .env reaches it.
# Loopback only. Janitor never removes the janitor-n8n-data volume.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: janitor-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JANITOR_N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: http://127.0.0.1:${JANITOR_N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # Plain HTTP on loopback: a secure cookie would never be sent back.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n-files:/files:ro
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  n8n-data:
    name: janitor-n8n-data

networks:
  n8n-network:
    name: janitor-n8n-network
