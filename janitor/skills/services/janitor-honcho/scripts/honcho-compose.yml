# Janitor local Honcho (janitor-honcho skill). Deployed by `honcho_setup.py deploy`
# into <janitor home>/docker/ next to honcho-llm.env (0600, only the LLM credentials
# Honcho needs) and built from <janitor home>/src/honcho (pinned commit).
# The API binds to loopback only. Volumes are never removed by Janitor.
# No credential lives in this file. The Postgres role and password are generated
# per install by `honcho_setup.py deploy` into honcho-db.env (0600) and reach the
# containers through env_file; an older install is rotated on its next deploy.
services:
  honcho-api:
    build:
      context: ../src/honcho
      dockerfile: Dockerfile
    image: janitor-honcho:local
    container_name: janitor-honcho-api
    entrypoint: ["sh", "docker/entrypoint.sh"]
    ports:
      - "127.0.0.1:${JANITOR_HONCHO_PORT:-1973}:8000"
    environment:
      - CACHE_URL=redis://honcho-redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: ./honcho-llm.env
        required: true
      - path: ./honcho-db.env
        required: true
    volumes:
      - honcho-api-data:/data
    restart: unless-stopped
    networks:
      - honcho-network
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  honcho-deriver:
    build:
      context: ../src/honcho
      dockerfile: Dockerfile
    image: janitor-honcho:local
    container_name: janitor-honcho-deriver
    entrypoint: ["python", "-m", "src.deriver"]
    environment:
      - CACHE_URL=redis://honcho-redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: ./honcho-llm.env
        required: true
      - path: ./honcho-db.env
        required: true
    restart: unless-stopped
    networks:
      - honcho-network
    depends_on:
      honcho-api:
        condition: service_started
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy

  honcho-database:
    image: pgvector/pgvector:pg15
    container_name: janitor-honcho-database
    environment:
      POSTGRES_DB: honcho
    env_file:
      - path: ./honcho-db.env
        required: true
    volumes:
      - ../src/honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - honcho-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - honcho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d honcho"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  honcho-redis:
    image: redis:8.2
    container_name: janitor-honcho-redis
    volumes:
      - honcho-redis-data:/data
    restart: unless-stopped
    networks:
      - honcho-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  honcho-pgdata:
    name: janitor-honcho-pgdata
  honcho-redis-data:
    name: janitor-honcho-redis-data
  honcho-api-data:
    name: janitor-honcho-api-data

networks:
  honcho-network:
    name: janitor-honcho-network
