# janitor-nocodb — NocoDB self-hosted (bases de datos con interfaz y API), skill janitor-nocodb.
# Copied by `nocodb_setup.py deploy` to <janitor root>/docker/ and run as compose project
# janitor-nocodb with `--env-file nocodb.env`. Each container gets only the variables
# listed below: no env_file, so nothing else from any .env reaches it.
# Two containers (NocoDB + its Postgres metadata database). Loopback only.
# Janitor never removes the janitor-nocodb-* volumes.
services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: janitor-nocodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JANITOR_NOCODB_PORT:-1980}:8080"
    environment:
      NC_DB: pg://nocodb-db:5432?u=nocodb&p=${NOCODB_DB_PASSWORD}&d=nocodb
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_DISABLE_TELE: "true"
    volumes:
      - nocodb-data:/usr/app/data
    depends_on:
      nocodb-db:
        condition: service_healthy
    networks:
      - nocodb-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nocodb-db:
    image: postgres:16-alpine
    container_name: janitor-nocodb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${NOCODB_DB_PASSWORD}
    volumes:
      - nocodb-pgdata:/var/lib/postgresql/data
    networks:
      - nocodb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  nocodb-data:
    name: janitor-nocodb-data
  nocodb-pgdata:
    name: janitor-nocodb-pgdata

networks:
  nocodb-network:
    name: janitor-nocodb-network
