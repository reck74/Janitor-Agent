<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>BOX BOX — SEPANG GP</title>
<style>
  :root {
    --bg: #07080a;
    --panel: #12171d;
    --line: #f0c400;
    --ink: #d7dde6;
    --muted: #9aa3ad;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "Courier New", monospace;
    overflow: hidden; touch-action: manipulation; overscroll-behavior: none; user-select: none;
  }
  #app {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: var(--bg);
  }
  #track-pane {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10140f;
    min-width: 0;
    min-height: 0;
  }
  #track-pane canvas {
    display: block;
    touch-action: none;
    background: #10140f;
    max-width: 100%;
    max-height: 100%;
  }
  #engineer-pane {
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-sizing: border-box;
    padding: 10px;
    background: var(--panel);
    border-left: 2px solid var(--line);
    min-width: 0;
    min-height: 0;
  }
  #board, #radio, #buttons {
    background: #171c22;
    border: 2px solid var(--line);
    box-shadow: 3px 3px 0 #000;
  }
  #board { padding: 8px; flex: 1 1 auto; overflow: auto; min-height: 160px; }
  #radio { padding: 10px 12px; flex: 0 0 auto; }
  #buttons { padding: 10px; flex: 0 0 auto; display: grid; gap: 8px; }
  .board-head, .radio-head {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--line); font-size: 11px; font-weight: 700; margin-bottom: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 10px;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 12px 34px 1fr 44px 40px;
    gap: 4px;
    align-items: center;
    font-size: 11px;
    line-height: 1.2;
    padding: 2px 2px;
  }
  .row.you { background: var(--line); color: #141414; }
  .swatch { width: 10px; height: 10px; display: inline-block; }
  .wear-hi { color: #ff5a5a; font-weight: 700; }
  .wear-mid { color: #ffb15a; }
  .fuel-lo { color: #ff5a5a; font-weight: 700; }
  .tag { font-size: 11px; font-weight: 700; color: var(--line); }
  .radio-lines { font-size: 13px; line-height: 1.35; }
  .radio-lines .l1 { color: #fff; font-size: 15px; font-weight: 700; }
  .radio-lines .l2 { color: var(--ink); }
  .radio-lines .l3 { color: var(--muted); font-size: 11px; }
  .radio-meta { display: flex; justify-content: space-between; margin-top: 8px; color: #c5ccd4; font-size: 10px; }
  .timer { font-size: 18px; color: #fff; font-weight: 700; }
  .timer.urgent { color: #ff5a3c; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-row.triple { grid-template-columns: 1fr 1fr 1fr; }
  button.action {
    appearance: none; border: 2px solid #fff; color: #fff; font: inherit;
    font-weight: 700; font-size: 14px; min-height: 64px; padding: 8px 6px;
    cursor: pointer; box-shadow: 3px 3px 0 #000;
  }
  button.action:disabled { background: #2a3038 !important; border-color: #555; color: #8b949e; cursor: default; box-shadow: none; }
  button.action .sub { display: block; font-size: 10px; font-weight: 600; margin-top: 4px; color: #ffe9a8; }
  button.action:disabled .sub { color: #6c7580; }
  button.box { background: #c45500; }
  button.stay { background: #1f7a45; }
  button.soft { background: #e10600; }
  button.medium { background: #b8860b; }
  button.hard { background: #6b7280; }
  button.fuel { background: #1a5cff; }
  button.inter { background: #1493e0; }
  button.wet { background: #0b6b4a; }
  #snd {
    align-self: flex-end; background: transparent; border: 0; color: var(--muted);
    font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px;
  }
  #flag-banner {
    display: none; position: absolute; inset: 0; z-index: 5;
    align-items: center; justify-content: center; flex-direction: column;
    pointer-events: none; text-align: center; font-weight: 700;
  }
  #flag-banner.show { display: flex; }
  #flag-banner.yellow { background: rgba(220, 180, 0, 0.35); }
  #flag-banner.red { background: rgba(160, 0, 0, 0.62); }
  #flag-banner .big { font-size: 28px; color: #fff; text-shadow: 0 2px 0 #000; }
  #flag-banner .sub { font-size: 16px; color: #ffd000; margin-top: 8px; }

  @media (min-width: 800px) {
    #app { flex-direction: row; overflow: hidden; }
    #track-pane { width: 60%; height: 100%; }
    #engineer-pane { width: 40%; height: 100%; overflow-y: auto; border-left: 2px solid var(--line); border-top: 0; }
  }
  @media (max-width: 799px) {
    html, body { overflow: hidden; }
    #app { flex-direction: column; overflow: hidden; }
    #track-pane { width: 100%; height: 50vh; flex: 0 0 50vh; }
    #engineer-pane {
      width: 100%; height: 50vh; flex: 1 1 auto;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      border-left: 0; border-top: 2px solid var(--line);
    }
  }
</style>

function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function heavy(ev) { return !!(ev && ev.length !== 'short'); }
function dist2(a, b) { const dx = a[0] - b[0], dy = a[1] - b[1]; return Math.hypot(dx, dy); }
function cmpInfo(id) { return COMPOUNDS[id] || COMPOUNDS.medium; }

function buildCum(pts, closed) {
  const c = [0];
  for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + dist2(pts[i - 1], pts[i]));
  c.total = c[c.length - 1] + (closed ? dist2(pts[pts.length - 1], pts[0]) : 0);
  return c;
}
function pointOn(pts, cum, dist, closed) {
  const total = cum.total || 1;
  let d = dist;
  if (closed) { d = ((d % total) + total) % total; }
  else d = clamp(d, 0, total);
  let i = 0;
  const n = pts.length;
  const last = closed ? n : n - 1;
  while (i < last - 1 && cum[i + 1] < d) i++;
  const i2 = closed ? (i + 1) % n : Math.min(i + 1, n - 1);
  const span = Math.max(1e-6, (closed && i2 === 0 ? total : cum[Math.min(i + 1, cum.length - 1)]) - cum[i]);

function curvature(s) {

function initGeom() {

function tone(freq, dur, type, vol, delay) {

    const t0 = c.currentTime + (delay || 0);

    const g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);

  }
  const where = you ? cornerName(you.s) : '';
  const wear = you ? Math.round(you.wear) : 0;
  const fuel = you ? Math.round(you.fuel) : 100;
  return {
    tag: 'RADIO',
    l1: where ? ('Vas por la curva ' + where + '.') : 'Vuelta en curso.',
    l2: cmpInfo(S.compound).label + ' ' + wear + '% desgaste · GAS ' + fuel + '%',
    l3: fuel < 15 ? '¡Combustible crítico! Velocidad a la mitad.' : (wear >= 85 ? 'Riesgo de pinchazo alto.' : 'P' + S.pos + ' de 20.'),
    timer: null,
  };
}
function syncEngineer() {
  const list = standings();
  const boxing = S.field.filter(c => !c.you && !c.dnf && (c.mode === 'pit' || c.mode === 'stop' || c.wantsPit)).length;
  let rows = '';
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const wear = Math.round(c.wear);
    const fuel = Math.round(c.fuel);
    const wearCls = wear >= 85 ? 'wear-hi' : wear >= 60 ? 'wear-mid' : '';
    const fuelCls = fuel < 15 ? 'fuel-lo' : '';
    const tag = c.dnf ? 'DNF' : (c.mode === 'pit' || c.mode === 'stop') ? 'BOX' : (c.mode === 'crash' ? 'YEL' : '');
    const activeLeader = list.find(x => !x.dnf) || list[0];
    const leader = progress(activeLeader);
    const firstActive = list.findIndex(x => !x.dnf);
    const gap = c.dnf ? 'OUT' : (i === firstActive ? 'LÍDER' : '+' + Math.max(0, (leader - progress(c)) / (70 * SCALE_TIME)).toFixed(1));
    rows += '<div class="row' + (c.you ? ' you' : '') + '">'
      + '<span>P' + (i + 1) + '</span>'
      + '<span class="swatch" style="background:' + c.body + '"></span>'
      + '<span>' + (c.you ? 'TÚ' : c.n) + '</span>'
      + '<span>' + gap + (tag ? ' ' + tag : '') + '</span>'
      + '<span class="' + wearCls + '">' + cmpInfo(c.compound).short + ' ' + wear + '%</span>'
      + '<span class="' + fuelCls + '">' + fuel + '%F</span>'
      + '</div>';
  }
  boardEl.innerHTML = '<div class="board-head"><span>PARRILLA</span><span>' + (boxing ? boxing + ' en boxes' : '20 coches') + '</span></div><div class="grid">' + rows + '</div>';

  const vm = radioVM();
  const calling = S.event && S.event.stage === 'call';
  radioEl.style.borderColor = calling ? '#ff5a3c' : '#f0c400';
  radioEl.innerHTML = '<div class="radio-head"><span class="tag">' + vm.tag + '</span>'
    + (vm.timer != null ? '<span class="timer' + (vm.timer <= 2 ? ' urgent' : '') + '">' + vm.timer.toFixed(1) + '</span>' : '')
    + '</div><div class="radio-lines"><div class="l1">' + vm.l1 + '</div><div class="l2">' + vm.l2 + '</div><div class="l3">' + vm.l3 + '</div></div>'
    + '<div class="radio-meta"><span>Penalización ' + S.lost.toFixed(0) + 's</span><span>' + (S.calls ? ('Aciertos ' + S.hits + '/' + S.calls) : 'Sin llamadas') + '</span></div>';

  sndEl.textContent = S.muted ? 'SND OFF' : 'SND';
  const inCall = !!(S.event && S.event.stage === 'call' && !S.event.choice);
  const busy = !S.you || !!S.you.dnf || S.you.mode === 'pit' || S.you.mode === 'stop' || S.phase === 'title' || S.redFlag > 0;
  const sig = [S.phase, S.menu, inCall, busy, S.muted, S.event && S.event.kind, S.event && S.event.stage].join('|');
  if (sig !== _btnSig) { _btnSig = sig; renderButtons(); }
}
function renderButtons() {
  const you = S.you;
  const inCall = !!(S.event && S.event.stage === 'call' && !S.event.choice);
  const busy = !you || !!you.dnf || you.mode === 'pit' || you.mode === 'stop' || S.phase === 'title' || S.redFlag > 0;
  const canBox = !busy && (inCall || S.phase === 'run' || S.phase === 'call');

  if (S.phase === 'title') {
    buttonsEl.innerHTML = '<div class="btn-row"><button class="action box" data-act="start">SALIR A PISTA<span class="sub">SEPANG GP</span></button></div>';
    return;
  }
  if (S.menu === 'tires') {
    buttonsEl.innerHTML = '<div class="btn-row triple">'
      + '<button class="action soft" data-act="tire" data-tire="soft"' + (busy ? ' disabled' : '') + '>BLANDA<span class="sub">x1.2 · 3%/v</span></button>'
      + '<button class="action medium" data-act="tire" data-tire="medium"' + (busy ? ' disabled' : '') + '>MEDIA<span class="sub">x1.0 · 1.5%/v</span></button>'
      + '<button class="action hard" data-act="tire" data-tire="hard"' + (busy ? ' disabled' : '') + '>DURA<span class="sub">x0.85 · 0.8%/v</span></button>'
      + '</div>'
      + '<div class="btn-row" style="margin-top:8px">'
      + '<button class="action inter" data-act="tire" data-tire="inter"' + (busy ? ' disabled' : '') + '>INTER<span class="sub">lluvia media</span></button>'
      + '<button class="action wet" data-act="tire" data-tire="wet"' + (busy ? ' disabled' : '') + '>LLUVIA<span class="sub">extrema</span></button>'
      + '</div>'
      + '<div class="btn-row" style="margin-top:8px"><button class="action stay" data-act="back">ATRÁS<span class="sub">MENÚ BOX</span></button></div>';
    return;
  }
  if (S.menu === 'box') {
    buttonsEl.innerHTML = '<div class="btn-row">'
      + '<button class="action box" data-act="tires"' + (busy ? ' disabled' : '') + '>CAMBIAR NEUMÁTICOS<span class="sub">SECO Y LLUVIA</span></button>'
      + '<button class="action fuel" data-act="refuel"' + (busy ? ' disabled' : '') + '>REPOSTAR<span class="sub">3s → 100%</span></button>'
      + '</div>'
      + (inCall
        ? '<div class="btn-row" style="margin-top:8px"><button class="action stay" data-act="stay">QUEDARSE<span class="sub">SEGUIR</span></button><button class="action stay" data-act="back">ATRÁS<span class="sub">CERRAR</span></button></div>'
        : '<div class="btn-row" style="margin-top:8px"><button class="action stay" data-act="back">ATRÁS<span class="sub">CERRAR</span></button></div>');
    return;
  }
  buttonsEl.innerHTML = '<div class="btn-row">'
    + '<button class="action box" data-act="box"' + (!canBox ? ' disabled' : '') + '>BOX BOX<span class="sub">' + (inCall ? 'NEUMÁTICOS / GAS' : (canBox ? 'ESTRATEGIA' : 'CERRADO')) + '</span></button>'
    + '<button class="action stay" data-act="stay"' + (!inCall ? ' disabled' : '') + '>QUEDARSE<span class="sub">' + (inCall ? 'SEGUIR' : 'EN PISTA') + '</span></button>'
    + '</div>';
}
function onAction(act, tire) {
  if (act === 'start') { startGame(); return; }
  if (act === 'snd') { S.muted = !S.muted; if (!S.muted) ac(); return; }
  if (act === 'box') { openBoxMenu(); return; }
  if (act === 'back') { S.menu = S.menu === 'tires' ? 'box' : null; return; }
  if (act === 'tires') { openTireMenu(); return; }
  if (act === 'refuel') { commitPit('fuel'); return; }
  if (act === 'tire') { commitPit('tires', tire); return; }
  if (act === 'stay') { chooseStay(); return; }
}
buttonsEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  onAction(btn.getAttribute('data-act'), btn.getAttribute('data-tire'));
});
sndEl.addEventListener('click', () => onAction('snd'));

function resize() {
  const pane = document.getElementById('track-pane');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.max(1, pane.clientWidth);
  const ph = Math.max(1, pane.clientHeight);
  const scale = Math.min(pw / W, ph / H);
  const cssW = Math.max(1, Math.floor(W * scale));
  const cssH = Math.max(1, Math.floor(H * scale));
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  canvas._m = scale * dpr;
  ctx.setTransform(canvas._m, 0, 0, canvas._m, 0, 0);
}
function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (S.phase === 'title') startGame();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (S.phase === 'title') startGame(); }
  else if (e.key === 'b' || e.key === 'B' || e.key === '1') { if (S.phase !== 'title') openBoxMenu(); }
  else if (e.key === 's' || e.key === 'S' || e.key === '2') { if (S.phase !== 'title') chooseStay(); }
  else if (e.key === 'm' || e.key === 'M') S.muted = !S.muted;
});
window.addEventListener('resize', resize);
window.addEventListener('error', e => { window.__ERR = String(e.message || e); });

function frame(ts) {
  const raw = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts;
  if (!PAUSE) for (let i = 0; i < FAST; i++) update(raw);
  draw();
  requestAnimationFrame(frame);
}

initGeom();
buildField();
resize();
requestAnimationFrame(frame);

window.__BOX = {
  S, start: startGame, chooseStay, openBoxMenu, commitPit, standings, place, progress,
  tick(dt) {
    let left = dt;
    while (left > 0) { const d = Math.min(0.05, left); update(d); left -= d; }
    draw();
  },
  forceEvent(kind, length, seconds) {
    S.force = { kind, length, seconds };
    const ev = makeEvent(kind);
    ev.stage = 'call'; ev.age = 0; S.event = ev; S.phase = 'call';
    armRivals(ev);
  },
  forceYellow() {
    const ais = S.field.filter(c => !c.you && !c.dnf && c.mode === 'track');
    if (ais.length) crashAI(ais[0]);
  },
  forceRed() { S.crashesThisLap = 1; const ais = S.field.filter(c => !c.you && !c.dnf && c.mode === 'track'); if (ais.length) crashAI(ais[0]); },
  setS(v) { if (S.you) S.you.s = v; },
};

</script>
</body>
