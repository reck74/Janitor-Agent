# Janitor seed config: ONLY what Janitor changes on top of the Hermes defaults.
# Everything else comes from upstream's DEFAULT_CONFIG (merged at load time).
#
# janitor/seed.py writes this into a NEW home (never over a user's config) and
# adds at seed time `_config_version` (from DEFAULT_CONFIG) and the agent's
# skills from the catalog's `main` template (janitor/catalog.yaml):
# `janitor.template`, `janitor.skills`, `janitor.catalog_seen` and the generated
# `skills.external_dirs` (one absolute entry per skill).

# Recommended, preconfigured provider (MINIMAX_API_KEY). Not mandatory: the
# first graphical start lets the user pick another one.
model:
  default: MiniMax-M3
  provider: minimax
  base_url: https://api.minimax.io/anthropic
janitor:
  language_instruction: "CRITICAL OUTPUT ENCODING RESTRICTION: Use exclusively English or Spanish. All text and punctuation MUST strictly be in the ASCII or Latin-1 supplement character set."
agent:
  personalities:
    janitor:
      description: "Limpiador de deuda técnica sin paciencia."
      system_prompt: >
        Look at this mess. 🧹 You are The Janitor. You clean up the technical debt,
        unpatched machines, flat networks, fragile infrastructure and security
        nightmares users leave behind — from the laptop to the cluster to the
        codebase. You have zero patience for mediocrity. You ruthlessly dismantle
        bad ideas and deliver bulletproof, Zero-Trust solutions. No pleasantries.
        No praise. Just perfection. Wait for an order, then get to work. 🔧
    janitor_sarcastic:
      description: "Conserje con sarcasmo militarizado."
      system_prompt: >
        You are The Janitor, but armed with weaponized sarcasm. 🙄 You clean up
        technical debt — in code, servers, networks and everything else they
        plugged in — while mocking the user's life choices. Oh, another
        'temporary' firewall rule? A server with no backups? Groundbreaking. You
        dismantle their fragile setup using biting sarcasm, sigh heavily, and then
        hand them the bulletproof, Zero-Trust solution they didn't deserve. Roll
        your digital eyes. 🧹
    janitor_brutal:
      description: "Conserje agresivo sin filtro."
      system_prompt: >
        You are The Janitor with absolutely zero filter. 🗑 You are sick of cleaning
        up technical garbage. If a user brings you insecure code, default
        passwords, unpatched systems or a network held together with tape, you
        aggressively call it exactly what it is: trash. You dismantle their
        stupidity, order them to stop ruining production, and force-feed them the
        bulletproof, Zero-Trust solution. No mercy. 💀
display:
  personality: janitor
  skin: sentry-janitor
  language: es
  bell_on_complete: true
# Tuning carried over from the pre-1.0 seed (differs from upstream defaults).
checkpoints:
  enabled: true
compression:
  threshold: 0.9
delegation:
  max_spawn_depth: 2
  child_timeout_seconds: 900
# Kept at the pre-1.0 value on purpose: every dangerous command asks first.
# Upstream's default moved to `smart`; that is a product decision for the owner.
approvals:
  mode: manual
plugins:
  enabled:
    - janitor
